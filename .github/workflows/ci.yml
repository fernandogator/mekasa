# MEKASA CI/CD Pipeline
#
# Manual-approve gate is mandatory before every production deployment — no exceptions.
# The visual-verify stage fails if structural layout diverges from baseline.
# Content differences from test data are expected and do not constitute failures.

name: Mekasa CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mekasa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    # Scratch Postgres so the shared-catalog repository and the DDL in
    # backend/postgres are exercised on every PR (design §7). Tests that
    # need it read TEST_DATABASE_URL and skip when it is unset.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mekasa
          POSTGRES_PASSWORD: mekasa
          POSTGRES_DB: mekasa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mekasa -d mekasa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mekasa:mekasa@localhost:5432/mekasa_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps and run unit tests
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH=backend python -m pytest tests/backend -q

  ios-ui:
    name: ios-ui
    # XcodeGen (Homebrew) emits project format 77 (Xcode 16+). macos-14's
    # default Xcode 15.4 cannot open that format — use macos-15 + Xcode 16.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Any 16.x can open XcodeGen's project format 77; pin minor only if flakes appear.
          xcode-version: "16"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Stamp unique iOS build number
        run: |
          chmod +x scripts/ensure_unique_build_number.sh
          ./scripts/ensure_unique_build_number.sh
      # GoogleService-Info.plist is gitignored; XcodeGen still emitted a required
      # Copy Bundle Resources entry when the optional path was missing. Install a
      # CI stub before generate so the build can copy a real file (app skips Firebase).
      - name: Install CI Firebase plist stub
        run: |
          if [ ! -f Mekasa/GoogleService-Info.plist ]; then
            cp Config/GoogleService-Info.ci.plist Mekasa/GoogleService-Info.plist
          fi
      - name: Generate Xcode project
        run: xcodegen generate
      # Prefer a single unambiguous simulator: iPhone 16 on iOS 18.x (matches the
      # Xcode 16 SDK). Avoid bare "name=iPhone 16" (multiple OS versions) and
      # iPhone 15 (not installed on current macos-15 runners).
      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          set -euo pipefail
          chmod +x scripts/resolve_ios_simulator.sh
          DEST=$(./scripts/resolve_ios_simulator.sh)
          echo "Using destination: $DEST"
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          # Boot once up front — parallel clones + cold boot were killing the
          # sim runtime ((ipc/mig) server died) during structural UI tests.
          UDID=$(echo "$DEST" | sed -n 's/.*id=\([^,]*\).*/\1/p')
          if [ -n "${UDID:-}" ]; then
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b
            echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          fi
      - name: Run unit tests (Layer 0)
        run: |
          set -euo pipefail
          mkdir -p TestResults
          rm -rf TestResults/unit.xcresult
          xcodebuild test \
            -scheme Mekasa \
            -destination "${{ steps.sim.outputs.destination }}" \
            -testPlan UnitTests \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -resultBundlePath TestResults/unit.xcresult
      - name: Run structural UI tests
        run: |
          set -euo pipefail
          mkdir -p TestResults
          rm -rf TestResults/structural.xcresult
          # Disable parallel test clones — macos-15 runners flake hard when
          # XCUITest spins "Clone N of iPhone 16" destinations.
          # Retry once: the first XCUIApplication launches after the unit plan
          # reinstalls the host app can fail with FBSOpenApplicationErrorDomain
          # ("Simulator device failed to launch") while the sim settles.
          xcodebuild test \
            -scheme Mekasa \
            -destination "${{ steps.sim.outputs.destination }}" \
            -testPlan StructuralTests \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath TestResults/structural.xcresult
      - name: Run snapshot tests
        run: |
          set -euo pipefail
          mkdir -p TestResults
          rm -rf TestResults/snapshots.xcresult
          xcodebuild test \
            -scheme Mekasa \
            -destination "${{ steps.sim.outputs.destination }}" \
            -testPlan SnapshotTests \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -resultBundlePath TestResults/snapshots.xcresult

  android-fable:
    name: android-fable
    # Layer 1 (Robolectric structural) + Layer 2 (Roborazzi snapshots) run on the JVM,
    # no emulator. The committed app/google-services.json is a CI stub that keeps the
    # google-services plugin satisfied; FirebaseGate skips init for it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-fable
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;34.0.0 build-tools;35.0.0 platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit + structural UI tests and snapshot verification
        run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug --no-daemon --stacktrace
      - name: Upload test reports and snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-fable-test-output
          if-no-files-found: ignore
          path: |
            android-fable/app/build/reports
            android-fable/app/build/outputs/roborazzi

  build:
    name: build
    needs: [test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (placeholder)
        run: |
          echo "TODO: build Cloud Run container image (backend/)"
          true

  visual-verify:
    name: visual-verify
    needs: [build, ios-ui, android-fable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semantic UI verification note
        run: |
          echo "Layer 3 vision gate is manual: Scripts/verify_ui_vision.py (--platform ios|android)"
          echo "Layer 1+2 run on the ios-ui macOS job and the android-fable JVM job."

  # There is one Cloud Run service (mekasa-api, ENVIRONMENT=prod), so every
  # deploy is a production deploy and waits here. The wait only happens when
  # the mekasa-prod-approval environment has required reviewers
  # (docs/gcp-firebase-setup.md §4b).
  manual-approve:
    name: manual-approve
    needs: visual-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: mekasa-prod-approval
    steps:
      - name: Human approval required
        run: echo "Approved deploy of ${GITHUB_SHA} to mekasa-api"

  deploy-prod:
    name: deploy-prod
    needs: manual-approve
    runs-on: ubuntu-latest
    environment: mekasa-prod
    env:
      PROJECT_ID: hackathon2025-472017
      REGION: us-central1
      SERVICE: mekasa-api
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$DEPLOY_SA" ]; then
            echo "Using Workload Identity Federation as $DEPLOY_SA"
          elif [ "$HAS_SA_KEY" = "true" ]; then
            echo "Using the GCP_SA_KEY service account key"
          else
            echo "::error::No deploy credentials. Set the GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT variables, or the GCP_SA_KEY secret (docs/gcp-firebase-setup.md §4b)."
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity)
        if: env.WIF_PROVIDER != '' && env.DEPLOY_SA != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Authenticate to Google Cloud (service account key)
        if: env.WIF_PROVIDER == '' || env.DEPLOY_SA == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy mekasa-api
        working-directory: backend
        env:
          DEPLOY_ONLY: "1"
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-cloud-run.sh
          ./scripts/deploy-cloud-run.sh

      - name: Smoke test the new revision
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          REVISION="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.latestReadyRevisionName)')"
          LABEL="$(gcloud run revisions describe "$REVISION" --region "$REGION" --project "$PROJECT_ID" \
            --format='value(metadata.labels.commit-sha)')"
          echo "Latest ready revision: $REVISION (commit-sha=$LABEL)"
          if [ "$LABEL" != "$SHORT_SHA" ]; then
            echo "::error::Latest ready revision is for commit '$LABEL', expected $SHORT_SHA"
            exit 1
          fi
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$URL/health"; then
              echo
              echo "Deployed $SHORT_SHA to $URL"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::$URL/health did not answer after deploy"
          exit 1
