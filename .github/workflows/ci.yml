          true

  visual-verify:
    name: visual-verify
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mekasa
    steps:
      - uses: actions/checkout@v4
      - name: Semantic UI verification against baselines
        run: |
