# MEKASA CI/CD Pipeline
#
# Manual-approve gate is mandatory before every production deployment — no exceptions.
# The visual-verify stage fails if structural layout diverges from baseline.
# Content differences from test data are expected and do not constitute failures.

name: Mekasa CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mekasa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps and run unit tests
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH=backend python -m pytest tests/backend -q

  ios-ui:
    name: ios-ui
    # XcodeGen (Homebrew) emits project format 77 (Xcode 16+). macos-14's
    # default Xcode 15.4 cannot open that format — use macos-15 + Xcode 16.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Any 16.x can open XcodeGen's project format 77; pin minor only if flakes appear.
          xcode-version: "16"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Stamp unique iOS build number
        run: |
          chmod +x scripts/ensure_unique_build_number.sh
          ./scripts/ensure_unique_build_number.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run structural UI tests
        run: |
          set -euo pipefail
          mkdir -p TestResults
          run_structural() {
            local dest="$1"
            local bundle="$2"
            rm -rf "$bundle"
            xcodebuild test \
              -scheme Mekasa \
              -destination "$dest" \
              -testPlan StructuralTests \
              -resultBundlePath "$bundle"
          }
          run_structural 'platform=iOS Simulator,name=iPhone 16' TestResults/structural.xcresult \
            || run_structural 'platform=iOS Simulator,name=iPhone 15' TestResults/structural-fallback.xcresult
      - name: Run snapshot tests
        run: |
          set -euo pipefail
          mkdir -p TestResults
          run_snapshots() {
            local dest="$1"
            local bundle="$2"
            rm -rf "$bundle"
            xcodebuild test \
              -scheme Mekasa \
              -destination "$dest" \
              -testPlan SnapshotTests \
              -resultBundlePath "$bundle"
          }
          run_snapshots 'platform=iOS Simulator,name=iPhone 16' TestResults/snapshots.xcresult \
            || run_snapshots 'platform=iOS Simulator,name=iPhone 15' TestResults/snapshots-fallback.xcresult

  build:
    name: build
    needs: [test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (placeholder)
        run: |
          echo "TODO: build Cloud Run container image (backend/)"
          true

  visual-verify:
    name: visual-verify
    needs: [build, ios-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semantic UI verification note
        run: |
          echo "Layer 3 vision gate is manual: Scripts/verify_ui_vision.py"
          echo "Layer 1+2 run on the ios-ui macOS job."

  deploy-dev:
    name: deploy-dev
    needs: visual-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: mekasa-dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend to GCP dev
        run: |
          echo "TODO: deploy Cloud Run service to mekasa-dev"
          true

  manual-approve:
    name: manual-approve
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: mekasa-prod-approval
    steps:
      - name: Human approval required
        run: echo "Production deploy gated on GitHub Environment approval"

  deploy-prod:
    name: deploy-prod
    needs: manual-approve
    runs-on: ubuntu-latest
    environment: mekasa-prod
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production after human approval
        run: |
          echo "TODO: deploy Cloud Run service to mekasa-prod"
          true
