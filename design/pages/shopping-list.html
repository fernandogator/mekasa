<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <title>Saturday List - Mekasa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="prefetch" href="dashboard.html" as="document">
  <link rel="prefetch" href="store-selection.html" as="document">
  <link rel="prefetch" href="add-items.html" as="document">
  <link rel="prefetch" href="trash-station.html" as="document">
  <link rel="prefetch" href="onboarding-household.html" as="document">
  <link rel="prefetch" href="spending-report.html" as="document">
  <link rel="prefetch" href="family-members.html" as="document">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    :root {
      --color-brand: #5d5652;
      --color-brand-muted: #8fa085;
      --color-surface: #ede8e0;
      --color-surface-elevated: #faf7f3;
      --color-text: #5d5652;
      --color-text-muted: #5c6b54;
      --color-accent: #5a6f4f;
      --color-danger: #5a6f4f;
      --color-success: #5a6f4f;
      --color-warning: #5a6f4f;
      --color-overlay: rgba(143, 160, 133, 0.20);
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--color-surface);
      color: var(--color-text);
      margin: 0;
    }
    html { background-color: var(--color-surface); }
    @view-transition { navigation: auto; }
    ::view-transition { background-color: var(--color-surface); }
    ::view-transition-old(nav),
    ::view-transition-new(nav) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(fab),
    ::view-transition-new(fab) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(sage-bg),
    ::view-transition-new(sage-bg) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(main-content) {
      animation: 0.25s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
      animation: 0.25s ease-in 0.1s both fade-in;
    }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    
    .text-brand { color: var(--color-brand); }
    .text-text { color: var(--color-text); }
    .text-muted { color: var(--color-text-muted); }
    .bg-brand { background-color: var(--color-brand); }
    .bg-accent { background-color: var(--color-accent); }
    .bg-surface-elevated { background-color: var(--color-surface-elevated); }
    .border-muted { border-color: rgba(143, 160, 133, 0.3); }
    .sage-blob {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--color-overlay);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }
    
    .checkbox-custom {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--color-brand-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .checkbox-custom.checked {
      background-color: var(--color-accent);
      border-color: var(--color-accent);
      color: white;
    }
  </style>
</head>
<body>
  <div class="w-full h-screen flex flex-col relative overflow-hidden bg-[#ede8e0]">
    <div class="sage-blob" style="view-transition-name: sage-bg"></div>
    
    <!-- Header -->
    <header class="shrink-0 pt-14 px-6 z-10" style="view-transition-name: page-header">
      <div class="flex justify-between items-start">
        <div>
          <h1 class="text-3xl font-black text-brand leading-none mb-1">Saturday list</h1>
          <div class="flex items-center text-[12px] font-bold text-muted uppercase tracking-[0.1em]">
            <span class="flex items-center gap-1"><iconify-icon icon="lucide:home"></iconify-icon> The Rivas House</span>
            <span class="mx-2">·</span>
            <span class="flex items-center gap-1 text-[#5a6f4f]"><div class="w-2 h-2 rounded-full bg-[#5a6f4f]"></div> shared live</span>
          </div>
        </div>
        <button class="w-10 h-10 rounded-full bg-surface-elevated shadow-sm flex items-center justify-center border border-muted">
          <iconify-icon icon="lucide:more-horizontal" class="text-xl text-brand"></iconify-icon>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-6 pt-6 pb-32 z-10" style="view-transition-name: main-content">
      
      <!-- List Items Container -->
      <div class="bg-surface-elevated rounded-[32px] p-2 shadow-[0_20px_50px_-12px_rgba(93,86,82,0.1)] border border-muted space-y-1 mb-8">
        
        <!-- Item 1: Checked -->
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f5f3ee] transition-colors">
          <div class="checkbox-custom checked mr-4 shrink-0">
            <iconify-icon icon="lucide:check" class="text-xl"></iconify-icon>
          </div>
          <div class="flex-1 opacity-50">
            <p class="font-bold text-[16px] line-through">2% milk</p>
            <p class="text-[12px] font-semibold text-muted">×2</p>
          </div>
        </div>

        <!-- Item 2: Needs Approval -->
        <div class="flex items-center p-3 rounded-[24px] bg-[#f5f3ee] transition-colors">
          <div class="w-10 h-10 rounded-full bg-[#ede8e0] flex items-center justify-center mr-4 shrink-0 overflow-hidden border border-muted">
            <span class="font-bold text-brand text-xs">MA</span>
          </div>
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-0.5">
              <p class="font-bold text-[16px]">Paper towels</p>
              <span class="text-[12px] font-bold uppercase tracking-wider text-white bg-[#5a6f4f] px-2 py-0.5 rounded-full">Needs approval</span>
            </div>
            <p class="text-[12px] font-semibold text-[#5a6f4f]">×1 • Requested by Maya</p>
          </div>
          <div class="flex space-x-2">
            <button class="w-10 h-10 rounded-full border border-muted flex items-center justify-center text-brand bg-white hover:bg-gray-50">
              <iconify-icon icon="lucide:x"></iconify-icon>
            </button>
            <button class="w-10 h-10 rounded-full bg-brand text-white flex items-center justify-center hover:opacity-90">
              <iconify-icon icon="lucide:check"></iconify-icon>
            </button>
          </div>
        </div>

        <!-- Item 3: Standard -->
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f5f3ee] transition-colors">
          <div class="checkbox-custom mr-4 shrink-0"></div>
          <div class="flex-1">
            <p class="font-bold text-[16px]">Eggs</p>
            <p class="text-[12px] font-semibold text-muted">×1 dozen</p>
          </div>
        </div>

        <!-- Item 4: Standard -->
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f5f3ee] transition-colors">
          <div class="checkbox-custom mr-4 shrink-0"></div>
          <div class="flex-1">
            <p class="font-bold text-[16px]">Avocados</p>
            <p class="text-[12px] font-semibold text-muted">×4</p>
          </div>
        </div>

        <!-- Item 5: Standard -->
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f5f3ee] transition-colors">
          <div class="checkbox-custom mr-4 shrink-0"></div>
          <div class="flex-1">
            <p class="font-bold text-[16px]">Dish soap</p>
          </div>
        </div>

      </div>

      <!-- Add Custom Item Action -->
      <button class="w-full py-4 rounded-[24px] border-2 border-dashed border-[#76896b] text-brand font-bold flex items-center justify-center gap-2 hover:bg-[#e4e1d9] transition-colors">
        <iconify-icon icon="lucide:plus-circle" class="text-xl"></iconify-icon>
        Add custom item
      </button>

    </main>

    <!-- Bottom Navigation -->
    <nav class="absolute bottom-8 left-6 right-6 z-40" style="view-transition-name: nav">
      <div class="bg-brand h-[64px] rounded-full flex items-center justify-between px-6 shadow-xl relative">
        <a href="dashboard.html" id="nav-home" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12 hover:text-white">
          <iconify-icon icon="lucide:home" class="text-2xl mb-1"></iconify-icon>
        </a>
        <a href="shopping-list.html" id="nav-list" class="flex flex-col items-center justify-center text-white w-12">
          <iconify-icon icon="lucide:list-todo" class="text-2xl mb-1"></iconify-icon>
        </a>
        
        <!-- Spacer for FAB -->
        <div class="w-16"></div>
        
        <a href="spending-report.html" id="nav-spend" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12 hover:text-white">
          <iconify-icon icon="lucide:pie-chart" class="text-2xl mb-1"></iconify-icon>
        </a>
        <a href="family-members.html" id="nav-people" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12 hover:text-white">
          <iconify-icon icon="lucide:users" class="text-2xl mb-1"></iconify-icon>
        </a>
      </div>
      
      <!-- Center Add FAB -->
      <a href="add-items.html" id="fab-add" class="absolute left-1/2 -top-6 -translate-x-1/2 w-[56px] h-[56px] bg-accent rounded-full flex items-center justify-center text-white shadow-[0_8px_16px_rgba(90,111,79,0.3)] border-[4px] border-[#ede8e0] active:scale-95 transition-transform" style="view-transition-name: fab">
        <iconify-icon icon="lucide:plus" class="text-2xl"></iconify-icon>
      </a>
    </nav>

  </div>
<nav class="fixed top-0 left-0 right-0 z-50 px-2 pt-1 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-md flex gap-1 flex-nowrap overflow-x-auto text-[12px] font-bold">
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="dashboard.html">Home</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="onboarding-household.html">Onboard</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="store-selection.html">Stores</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="shopping-list.html">List</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="add-items.html">Add</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="scan-receipt-results.html">Scan</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="trash-station.html">Trash</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="spending-report.html">Spend</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="family-members.html">Family</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="../">Index</a>
  </div>
</nav>
</body>
</html>
