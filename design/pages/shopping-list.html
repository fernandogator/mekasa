<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="view-transition" content="same-origin" />
  <title>Mekasa — Shopping list</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #eeebe3; }
    @view-transition { navigation: auto; }
  </style>
</head>
<body>
<style>  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  :root {
    --color-brand: #171e19;
    --color-brand-muted: #b7c6c2;
    --color-surface: #eeebe3;
    --color-surface-elevated: #ffffff;
    --color-text: #171e19;
    --color-text-muted: #6d7a76;
    --color-accent: #ca0013;
    --color-danger: #ca0013;
    --color-success: #2f6b4f;
    --color-warning: #c45c12;
    --color-overlay: rgba(183, 198, 194, 0.20);
  }
  .mekasa-screen {
    font-family: Nunito, sans-serif;
    background-color: var(--color-surface);
    color: var(--color-text);
  }
  .mekasa-screen .text-brand { color: var(--color-brand); }
  .mekasa-screen .text-muted { color: var(--color-text-muted); }
  .mekasa-screen .bg-brand { background-color: var(--color-brand); }
  .mekasa-screen .bg-accent { background-color: var(--color-accent); }
  .mekasa-screen .bg-surface-elevated { background-color: var(--color-surface-elevated); }
  .mekasa-screen .border-muted { border-color: rgba(183, 198, 194, 0.3); }
  .mekasa-screen .sage-blob {
    position: absolute;
    top: -50px;
    right: -50px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: var(--color-overlay);
    filter: blur(40px);
    z-index: 0;
    pointer-events: none;
  }
  .mekasa-screen .store-checkbox {
    appearance: none;
    width: 24px;
    height: 24px;
    border: 2px solid var(--color-brand-muted);
    border-radius: 50%;
    outline: none;
    cursor: pointer;
    position: relative;
  }
  .mekasa-screen .store-checkbox:checked {
    background-color: var(--color-accent);
    border-color: var(--color-accent);
  }
  .mekasa-screen .checkbox-custom {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--color-brand-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mekasa-screen .checkbox-custom.checked {
    background-color: var(--color-accent);
    border-color: var(--color-accent);
    color: white;
  }</style>

      <div class="mekasa-screen w-full h-screen flex flex-col relative overflow-hidden bg-[#eeebe3]">
    <div class="sage-blob" style="view-transition-name: sage-bg"></div>
    
    
    <header class="shrink-0 pt-14 px-6 z-10" style="view-transition-name: page-header">
      <div class="flex justify-between items-start">
        <div>
          <h1 class="text-3xl font-black text-brand leading-none mb-1">Saturday list</h1>
          <div class="flex items-center text-[12px] font-bold text-muted uppercase tracking-[0.1em]">
            <span class="flex items-center gap-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg> The Rivas House</span>
            <span class="mx-2">·</span>
            <span class="flex items-center gap-1 text-[#2f6b4f]"><div class="w-2 h-2 rounded-full bg-[#2f6b4f]"></div> shared live</span>
          </div>
        </div>
        <button class="w-10 h-10 rounded-full bg-surface-elevated shadow-sm flex items-center justify-center border border-muted">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="6" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="18" cy="12" r="1" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    
    <main class="flex-1 overflow-y-auto px-6 pt-6 pb-32 z-10" style="view-transition-name: main-content">
      
      
      <div class="bg-surface-elevated rounded-[32px] p-2 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.08)] border border-muted space-y-1 mb-8">
        
        
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f8f9f8] transition-colors">
          <div class="checkbox-custom checked mr-4 shrink-0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="m5 12 5 5L20 7"/></svg>
          </div>
          <div class="flex-1 opacity-50">
            <p class="font-bold text-[16px] line-through">2% milk</p>
            <p class="text-[12px] font-semibold text-muted">×2</p>
          </div>
        </div>

        
        <div class="flex items-center p-3 rounded-[24px] bg-[#fff5f0] transition-colors">
          <div class="w-10 h-10 rounded-full bg-[#f1f4f3] flex items-center justify-center mr-4 shrink-0 overflow-hidden border border-muted">
            <span class="font-bold text-brand text-xs">MA</span>
          </div>
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-0.5">
              <p class="font-bold text-[16px]">Paper towels</p>
              <span class="text-[10px] font-bold uppercase tracking-wider text-white bg-[#c45c12] px-2 py-0.5 rounded-full">Needs approval</span>
            </div>
            <p class="text-[12px] font-semibold text-[#c45c12]">×1 • Requested by Maya</p>
          </div>
          <div class="flex space-x-2">
            <button class="w-10 h-10 rounded-full border border-muted flex items-center justify-center text-brand bg-white">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
            <button class="w-10 h-10 rounded-full bg-brand text-white flex items-center justify-center">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="m5 12 5 5L20 7"/></svg>
            </button>
          </div>
        </div>

        
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f8f9f8] transition-colors">
          <div class="checkbox-custom mr-4 shrink-0"></div>
          <div class="flex-1">
            <p class="font-bold text-[16px]">Eggs</p>
            <p class="text-[12px] font-semibold text-muted">×1 dozen</p>
          </div>
        </div>

        
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f8f9f8] transition-colors">
          <div class="checkbox-custom mr-4 shrink-0"></div>
          <div class="flex-1">
            <p class="font-bold text-[16px]">Avocados</p>
            <p class="text-[12px] font-semibold text-muted">×4</p>
          </div>
        </div>

        
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f8f9f8] transition-colors">
          <div class="checkbox-custom mr-4 shrink-0"></div>
          <div class="flex-1">
            <p class="font-bold text-[16px]">Dish soap</p>
          </div>
        </div>

      </div>

      
      <button class="w-full py-4 rounded-[24px] border-2 border-dashed border-[#b7c6c2] text-brand font-bold flex items-center justify-center gap-2 hover:bg-[#e4ecea] transition-colors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        Add custom item
      </button>

    </main>

    
    <nav class="absolute bottom-8 left-6 right-6 z-40" style="view-transition-name: main-nav">
      <div class="bg-brand h-[64px] rounded-full flex items-center justify-between px-6 shadow-xl relative">
        <a href="#" class="flex flex-col items-center justify-center text-[#b7c6c2] w-12">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-white w-12">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M8 6h13M8 12h13M8 18h13"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/></svg>
        </a>
        
        
        <div class="w-16"></div>
        
        <a href="#" class="flex flex-col items-center justify-center text-[#b7c6c2] w-12">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-[#b7c6c2] w-12">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </a>
      </div>
      
      
      <a href="#" class="absolute left-1/2 -top-6 -translate-x-1/2 w-[56px] h-[56px] bg-accent rounded-full flex items-center justify-center text-white shadow-[0_8px_16px_rgba(202,0,19,0.3)] border-[4px] border-[#eeebe3] active:scale-95 transition-transform" style="view-transition-name: fab-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M12 5v14M5 12h14"/></svg>
      </a>
    </nav>

  </div>
    
  
<nav class="fixed bottom-0 left-0 right-0 z-50 px-4 pb-4 pt-2 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-md flex gap-2 justify-center flex-wrap text-[11px] font-bold">
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="dashboard.html">Home</a>

    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="../">Index</a>
  </div>
</nav>

</body>
</html>
