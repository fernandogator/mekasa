    <!-- Theme initialization (prevent flash) -->
    <script>
      try {
        // Light/dark mode initialization
        const theme = localStorage.getItem('theme');
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const activeTheme = theme || systemTheme;
        if (activeTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }

        // Color theme initialization
        const colorTheme = localStorage.getItem('colorTheme');
        if (colorTheme && colorTheme !== 'default') {
          document.documentElement.setAttribute('data-color-theme-pending', colorTheme);
        }
      } catch (e) {}

      // iOS input handling to prevent zoom
      (function() {
        if (!/iPad|iPhone|iPod/.test(navigator.userAgent)) return;

        document.addEventListener('focusin', function(e) {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            e.target.style.fontSize = '16px';
            e.target.style.transform = 'translateZ(0)';
          }
        });

        document.addEventListener('focusout', function(e) {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            e.target.style.fontSize = '16px';
          }
        });
      })();
    </script>

  <body class="antialiased">
    <!--
      translate="no" opts the React root out of browser auto-translation
      (Google Translate / Chrome "translate this page"). The translator rewrites
      text nodes in place, which desyncs React's virtual DOM and throws
      NotFoundError on insertBefore/removeChild during reconciliation (SUP-53, SUP-60).
      This is an interactive design tool, not static content, so machine-translating
      the app UI is unsafe. Marketing/blog pages live in a separate build and stay translatable.
    -->
    <div id="root" translate="no" class="notranslate"></div>
