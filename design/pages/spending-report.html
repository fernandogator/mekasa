<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="view-transition" content="same-origin" />
  <title>Mekasa — Spending</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #eeebe3; }
    @view-transition { navigation: auto; }
  </style>
</head>
<body>
<style>  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  :root {
    --color-brand: #171e19;
    --color-brand-muted: #b7c6c2;
    --color-surface: #eeebe3;
    --color-surface-elevated: #ffffff;
    --color-text: #171e19;
    --color-text-muted: #6d7a76;
    --color-accent: #ca0013;
    --color-danger: #ca0013;
    --color-success: #2f6b4f;
    --color-warning: #c45c12;
    --color-overlay: rgba(183, 198, 194, 0.20);
  }
  .mekasa-screen {
    font-family: Nunito, sans-serif;
    background-color: var(--color-surface);
    color: var(--color-text);
  }
  .mekasa-screen .text-brand { color: var(--color-brand); }
  .mekasa-screen .text-muted { color: var(--color-text-muted); }
  .mekasa-screen .bg-brand { background-color: var(--color-brand); }
  .mekasa-screen .bg-accent { background-color: var(--color-accent); }
  .mekasa-screen .bg-surface-elevated { background-color: var(--color-surface-elevated); }
  .mekasa-screen .border-muted { border-color: rgba(183, 198, 194, 0.3); }
  .mekasa-screen .sage-blob {
    position: absolute;
    top: -50px;
    right: -50px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: var(--color-overlay);
    filter: blur(40px);
    z-index: 0;
    pointer-events: none;
  }
  .mekasa-screen .store-checkbox {
    appearance: none;
    width: 24px;
    height: 24px;
    border: 2px solid var(--color-brand-muted);
    border-radius: 50%;
    outline: none;
    cursor: pointer;
    position: relative;
  }
  .mekasa-screen .store-checkbox:checked {
    background-color: var(--color-accent);
    border-color: var(--color-accent);
  }
  .mekasa-screen .checkbox-custom {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--color-brand-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mekasa-screen .checkbox-custom.checked {
    background-color: var(--color-accent);
    border-color: var(--color-accent);
    color: white;
  }</style>

      <div class="mekasa-screen w-full h-screen flex flex-col relative overflow-hidden bg-[#eeebe3]">
    <div class="sage-blob"></div>
    
    
    <header class="shrink-0 pt-14 px-6 z-10">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-black text-brand leading-none">This month</h1>
        <div class="bg-surface-elevated rounded-full p-1 border border-muted flex items-center shadow-sm">
            <button class="px-3 py-1 rounded-full text-[12px] font-bold text-muted">W</button>
            <button class="px-3 py-1 rounded-full text-[12px] font-bold bg-brand text-white">M</button>
            <button class="px-3 py-1 rounded-full text-[12px] font-bold text-muted">Y</button>
        </div>
      </div>
    </header>

    
    <main class="flex-1 overflow-y-auto px-6 pb-32 z-10 space-y-8" style="view-transition-name: main-content">
      
      
      <div class="flex flex-col items-center justify-center py-6">
        <p class="text-[12px] font-bold uppercase tracking-[0.1em] text-muted mb-2">Total Spend</p>
        <h2 class="text-[56px] font-black text-brand leading-none tracking-tight">$186<span class="text-[32px] text-muted">.40</span></h2>
      </div>

      
      <section class="bg-surface-elevated rounded-[40px] p-6 shadow-sm border border-muted space-y-6">
        <h3 class="text-[20px] font-extrabold mb-4">By Category</h3>
        
        
        <div class="space-y-2">
            <div class="flex justify-between items-end">
                <span class="text-[16px] font-bold">Groceries</span>
                <span class="text-[16px] font-black">$112.50</span>
            </div>
            <div class="h-4 w-full bg-[#eaf1ec] rounded-full overflow-hidden">
                <div class="h-full bg-brand rounded-full" style="width: 65%"></div>
            </div>
            <p class="text-[10px] font-bold text-muted uppercase tracking-wider">$200 Budget</p>
        </div>

        
        <div class="space-y-2">
            <div class="flex justify-between items-end">
                <span class="text-[16px] font-bold">Household</span>
                <span class="text-[16px] font-black text-[#ca0013]">$48.90</span>
            </div>
            <div class="h-4 w-full bg-[#fce5e7] rounded-full overflow-hidden">
                <div class="h-full bg-accent rounded-full" style="width: 100%"></div>
            </div>
            <p class="text-[10px] font-bold text-[#ca0013] uppercase tracking-wider">$40 Budget (Over)</p>
        </div>

        
        <div class="space-y-2">
            <div class="flex justify-between items-end">
                <span class="text-[16px] font-bold">Pets</span>
                <span class="text-[16px] font-black">$15.00</span>
            </div>
            <div class="h-4 w-full bg-[#eaf1ec] rounded-full overflow-hidden">
                <div class="h-full bg-brand rounded-full" style="width: 25%"></div>
            </div>
            <p class="text-[10px] font-bold text-muted uppercase tracking-wider">$60 Budget</p>
        </div>

        
        <div class="space-y-2">
            <div class="flex justify-between items-end">
                <span class="text-[16px] font-bold">Personal</span>
                <span class="text-[16px] font-black">$10.00</span>
            </div>
            <div class="h-4 w-full bg-[#eaf1ec] rounded-full overflow-hidden">
                <div class="h-full bg-brand rounded-full" style="width: 15%"></div>
            </div>
            <p class="text-[10px] font-bold text-muted uppercase tracking-wider">$80 Budget</p>
        </div>
      </section>

      
      <div class="bg-surface-elevated p-5 rounded-[40px] shadow-sm border border-muted flex items-center">
        <div class="w-12 h-12 rounded-full bg-[#f1f4f3] flex items-center justify-center mr-4">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
        </div>
        <div>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">Top Store</p>
            <p class="text-[20px] font-extrabold">H-E-B</p>
        </div>
      </div>

    </main>

    
    <div class="absolute bottom-8 left-6 right-6 z-40" style="view-transition-name: nav">
      <div class="bg-brand h-[64px] rounded-full flex items-center justify-between px-6 shadow-xl relative">
        <a href="#" class="flex flex-col items-center justify-center text-[#b7c6c2] w-12">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-[#b7c6c2] w-12">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M8 6h13M8 12h13M8 18h13"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/></svg>
        </a>
        
        
        <div class="w-16"></div>
        
        <a href="#" class="flex flex-col items-center justify-center text-white w-12">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-[#b7c6c2] w-12">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </a>
      </div>
      
      
      <a href="#" class="absolute left-1/2 -top-6 -translate-x-1/2 w-[56px] h-[56px] bg-accent rounded-full flex items-center justify-center text-white shadow-[0_8px_16px_rgba(202,0,19,0.3)] border-[4px] border-[#eeebe3] active:scale-95 transition-transform">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M12 5v14M5 12h14"/></svg>
      </a>
    </div>

  </div>
    
  
<nav class="fixed bottom-0 left-0 right-0 z-50 px-4 pb-4 pt-2 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-md flex gap-2 justify-center flex-wrap text-[11px] font-bold">
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="dashboard.html">Home</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="onboarding-household.html">Onboard</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="store-selection.html">Stores</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="shopping-list.html">List</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="add-items.html">Add</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="trash-station.html">Trash</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="spending-report.html">Spend</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="family-members.html">Family</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="../">Index</a>
  </div>
</nav>

</body>
</html>
