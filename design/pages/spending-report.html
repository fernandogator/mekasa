<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mekasa - Spending Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <meta name="view-transition" content="same-origin">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    :root {
      --color-brand: #5d5652;
      --color-brand-muted: #8fa085;
      --color-surface: #ede8e0;
      --color-surface-elevated: #faf7f3;
      --color-text: #5d5652;
      --color-text-muted: #5c6b54;
      --color-accent: #5a6f4f;
      --color-danger: #a44a3f;
      --color-success: #5a6f4f;
      --color-warning: #c45c12;
      --color-overlay: rgba(143, 160, 133, 0.15);
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--color-surface);
      color: var(--color-text);
      margin: 0;
    }
    .text-brand { color: var(--color-brand); }
    .text-text { color: var(--color-text); }
    .text-muted { color: var(--color-text-muted); }
    .bg-brand { background-color: var(--color-brand); }
    .bg-accent { background-color: var(--color-accent); }
    .bg-surface-elevated { background-color: var(--color-surface-elevated); }
    .border-muted { border-color: rgba(183, 198, 194, 0.3); }
    .sage-blob {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--color-overlay);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }
    
    /* View Transitions */
    html {
        background-color: var(--color-surface);
    }
    @view-transition { navigation: auto; }
    ::view-transition { background-color: var(--color-surface); }

    ::view-transition-old(nav), ::view-transition-new(nav),
    ::view-transition-old(fab), ::view-transition-new(fab),
    ::view-transition-old(sage-blob), ::view-transition-new(sage-blob) {
        animation: none;
        mix-blend-mode: normal;
    }

    ::view-transition-old(main-content) {
        animation: 0.25s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
        animation: 0.25s ease-in 0.1s both fade-in;
    }

    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    ::view-transition-old(root),
    ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
    }
  </style>
</head>
<body>
  <div class="w-full h-screen flex flex-col relative overflow-hidden bg-[#ede8e0]">
    <div class="sage-blob" style="view-transition-name: sage-blob"></div>
    
    <!-- Header -->
    <header class="shrink-0 pt-14 px-6 z-10">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-black text-brand leading-none">This month</h1>
        <div class="bg-surface-elevated rounded-full p-1 border border-muted flex items-center shadow-sm">
            <button class="px-3 py-1 rounded-full text-[12px] font-bold text-muted">W</button>
            <button class="px-3 py-1 rounded-full text-[12px] font-bold bg-brand text-white">M</button>
            <button class="px-3 py-1 rounded-full text-[12px] font-bold text-muted">Y</button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-6 pb-32 z-10 space-y-8" style="view-transition-name: main-content">
      
      <!-- Hero Amount -->
      <div class="flex flex-col items-center justify-center py-6">
        <p class="text-[12px] font-bold uppercase tracking-[0.1em] text-muted mb-2">Total Spend</p>
        <h2 class="text-[56px] font-black text-brand leading-none tracking-tight">$186<span class="text-[32px] text-muted">.40</span></h2>
      </div>

      <!-- Categories -->
      <section class="bg-surface-elevated rounded-[40px] p-6 shadow-sm border border-muted space-y-6">
        <h3 class="text-[20px] font-extrabold mb-4">By Category</h3>
        
        <!-- Category 1: Groceries -->
        <div class="space-y-2">
            <div class="flex justify-between items-end">
                <span class="text-[16px] font-bold">Pantry</span>
                <span class="text-[16px] font-black">$112.50</span>
            </div>
            <div class="h-4 w-full bg-[#8fa085]/30 rounded-full overflow-hidden">
                <div class="h-full bg-brand rounded-full" style="width: 65%"></div>
            </div>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">$200 Budget</p>
        </div>

        <!-- Category 2: Household (Over budget) -->
        <div class="space-y-2">
            <div class="flex justify-between items-end">
                <span class="text-[16px] font-bold">Household</span>
                <span class="text-[16px] font-black text-[#a44a3f]">$48.90</span>
            </div>
            <div class="h-4 w-full bg-[#ca0013]/10 rounded-full overflow-hidden">
                <div class="h-full bg-accent rounded-full" style="width: 100%"></div>
            </div>
            <p class="text-[12px] font-bold text-[#a44a3f] uppercase tracking-wider">$40 Budget (Over)</p>
        </div>

        <!-- Category 3: Pets -->
        <div class="space-y-2">
            <div class="flex justify-between items-end">
                <span class="text-[16px] font-bold">Produce</span>
                <span class="text-[16px] font-black">$15.00</span>
            </div>
            <div class="h-4 w-full bg-[#8fa085]/30 rounded-full overflow-hidden">
                <div class="h-full bg-brand rounded-full" style="width: 25%"></div>
            </div>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">$60 Budget</p>
        </div>

        <!-- Category 4: Personal -->
        <div class="space-y-2">
            <div class="flex justify-between items-end">
                <span class="text-[16px] font-bold">Dairy</span>
                <span class="text-[16px] font-black">$10.00</span>
            </div>
            <div class="h-4 w-full bg-[#8fa085]/30 rounded-full overflow-hidden">
                <div class="h-full bg-brand rounded-full" style="width: 15%"></div>
            </div>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">$80 Budget</p>
        </div>
      </section>

      <!-- Top Store -->
      <div class="bg-surface-elevated p-5 rounded-[40px] shadow-sm border border-muted flex items-center">
        <div class="w-12 h-12 rounded-full bg-[#ede8e0] flex items-center justify-center mr-4">
            <iconify-icon icon="lucide:shopping-bag" class="text-2xl text-brand"></iconify-icon>
        </div>
        <div>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">Top Store</p>
            <p class="text-[20px] font-extrabold">H-E-B</p>
        </div>
      </div>

    </main>

    <!-- Bottom Navigation -->
    <div class="absolute bottom-8 left-6 right-6 z-40" style="view-transition-name: nav">
      <div class="bg-brand h-[64px] rounded-full flex items-center justify-between px-6 shadow-xl relative">
        <a id="nav-home-link" href="dashboard.html" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12">
          <iconify-icon icon="lucide:home" class="text-2xl mb-1"></iconify-icon>
        </a>
        <a id="nav-list-link" href="shopping-list.html" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12">
          <iconify-icon icon="lucide:list-todo" class="text-2xl mb-1"></iconify-icon>
        </a>
        
        <!-- Spacer for FAB -->
        <div class="w-16"></div>
        
        <a id="nav-spend-link" href="spending-report.html" class="flex flex-col items-center justify-center text-white w-12">
          <iconify-icon icon="lucide:pie-chart" class="text-2xl mb-1"></iconify-icon>
        </a>
        <a id="nav-people-link" href="family-members.html" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12">
          <iconify-icon icon="lucide:users" class="text-2xl mb-1"></iconify-icon>
        </a>
      </div>
      
      <!-- Center Add FAB -->
      <a id="fab-add-btn" href="add-items.html" style="view-transition-name: fab" class="absolute left-1/2 -top-6 -translate-x-1/2 w-[56px] h-[56px] bg-accent rounded-full flex items-center justify-center text-white shadow-[0_8px_16px_rgba(202,0,19,0.3)] border-[4px] border-[#f0f3ed] active:scale-95 transition-transform">
        <iconify-icon icon="lucide:plus" class="text-2xl"></iconify-icon>
      </a>
    </div>

  </div>
<nav class="fixed top-0 left-0 right-0 z-50 px-2 pt-1 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-md flex gap-1 flex-nowrap overflow-x-auto text-[12px] font-bold">
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="dashboard.html">Home</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="onboarding-household.html">Onboard</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="store-selection.html">Stores</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="shopping-list.html">List</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="add-items.html">Add</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="scan-receipt-results.html">Scan</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="trash-station.html">Trash</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="spending-report.html">Spend</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="family-members.html">Family</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="../">Index</a>
  </div>
</nav>
</body></html>
