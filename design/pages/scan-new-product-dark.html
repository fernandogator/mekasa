ata-sd-id="photo-caption-wrap"><p class="text-[14px] font-bold text-[#EDE8E0]" data-sd-id="photo-caption-title">Product photo</p><button id="photo-caption-action" class="text-[12px] font-bold text-[#A9B79F] underline underline-offset-2 min-h-[44px]" data-sd-id="photo-caption-action-text">Add a photo (optional)</button></div></div><div class="flex items-center gap-2 mb-6 min-h-[44px]" data-sd-id="shared-row"><iconify-icon icon="lucide:users" class="text-[#7F8E76] text-lg shrink-0"></iconify-icon><span class="text-[13px] font-semibold text-[#A9B79F]" data-sd-id="shared-label">Shared with all users</span><button id="shared-info-btn" aria-label="More information about shared products" class="w-[28px] h-[28px] rounded-full border border-[#7F8E76] flex items-center justify-center text-[#7F8E76] hover:bg-[#7F8E76]/10 transition-colors shrink-0" data-sd-id="shared-info"><iconify-icon icon="lucide:info" class="text-sm"></iconify-icon></button></div><div class="bg-[#272421] rounded-[24px] p-5 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.35)] border border-[#7F8E76]/20 mb-8" data-sd-id="25"><h3 class="text-[12px] font-black text-[#A9B79F] uppercase tracking-wider mb-4" data-sd-id="26">Product details</h3><div class="space-y-4" data-sd-id="27"><div class="space-y-1" data-sd-id="28"><label for="product-name-input" class="text-[12px] font-bold text-[#A9B79F] uppercase tracking-widest pl-1" data-sd-id="29">Name</label><input id="product-name-input" type="text" value="Mtn Dew 12 Pack" class="w-full h-12 bg-[#3A3531]/60 rounded-[12px] px-4 font-bold text-[16px] text-[#EDE8E0] border border-transparent focus:bg-[#3A3531] focus:border-[#8FA085] focus:outline-none" data-sd-id="30"></div><div class="space-y-1" data-sd-id="31"><label for="product-category-select" class="text-[12px] font-bold text-[#A9B79F] uppercase tracking-widest pl-1" data-sd-id="32">Category</label><div class="relative" data-sd-id="33"><select id="product-category-select" class="w-full h-12 bg-[#3A3531]/60 rounded-[12px] px-4 font-bold text-[16px] text-[#EDE8E0] border border-transparent appearance-none focus:bg-[#3A3531] focus:border-[#8FA085] focus:outline-none" data-sd-id="34"><option value="Produce" data-sd-id="cat-produce">Produce</option><option value="Dairy" data-sd-id="cat-dairy">Dairy</option><option value="Pantry" data-sd-id="cat-pantry">Pantry</option><option value="Meat" data-sd-id="cat-meat">Meat</option><option value="Frozen" data-sd-id="cat-frozen">Frozen</option><option value="Beverages" selected="" data-sd-id="cat-beverages">Beverages</option><option value="Household" data-sd-id="cat-household">Household</option><option value="Other" data-sd-id="cat-other">Other</option></select><iconify-icon icon="lucide:chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#7F8E76]"></iconify-icon></div></div></div></div></main><footer class="shrink-0 p-6 pb-[34px] z-10 space-y-3" data-sd-id="39"><button id="cta-save-product" class="flex items-center justify-center w-full h-14 bg-[#8FA085] text-[#1C1A18] rounded-[24px] font-black text-[18px] shadow-[0_8px_20px_rgba(0,0,0,0.35)] active:scale-95 transition-transform px-4" data-sd-id="40"><span id="cta-save-product-label" class="truncate whitespace-nowrap overflow-hidden max-w-full">Save as Mtn Dew 12 Pack</span></button><a id="btn-skip-item" href="scan-haul-summary-dark.html" class="w-full min-h-[44px] flex items-center justify-center text-[14px] font-extrabold text-[#A9B79F] uppercase tracking-wider" data-sd-id="skip-item">Skip this item</a></footer></div><script>
    (function() {
      var nameInput = document.getElementById('product-name-input');
      var saveBtn = document.getElementById('cta-save-product');
      var saveLabel = document.getElementById('cta-save-product-label');
      function updateSaveButton() {
        var val = nameInput.value.trim();
        if (val === '') {
          saveLabel.textContent = 'Save product';
          saveBtn.setAttribute('disabled', 'true');
          saveBtn.classList.remove('bg-[#8FA085]');
          saveBtn.classList.add('bg-[#7F8E76]', 'opacity-60', 'cursor-not-allowed');
        } else {
          saveLabel.textContent = 'Save as ' + val;
          saveBtn.removeAttribute('disabled');
          saveBtn.classList.remove('bg-[#7F8E76]', 'opacity-60', 'cursor-not-allowed');
          saveBtn.classList.add('bg-[#8FA085]');
        }
      }
      nameInput.addEventListener('input', updateSaveButton);
      updateSaveButton();
    })();
  </script></body></html>
