<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="view-transition" content="same-origin"><title>Barcode Scan - Dark Mode</title><link rel="prefetch" href="dashboard-dark.html" as="document"><link rel="prefetch" href="scan-barcode-dark.html" as="document"><link rel="prefetch" href="scan-new-product-dark.html" as="document"><link rel="prefetch" href="scan-haul-summary-dark.html" as="document"><script src="https://cdn.tailwindcss.com"></script><script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
    :root {
      --color-surface: #1C1A18;
      --color-elevated: #272421;
      --color-dark-fill: #3A3531;
      --color-text: #EDE8E0;
      --color-text-muted: #A9B79F;
      --color-primary: #8FA085;
      --color-primary-label: #1C1A18;
      --color-accent: #A3B598;
      --color-danger: #E39286;
      --color-warning: #E2B07E;
      --color-warning-chip: #3A2E22;
      --color-success-chip: #2C3628;
      --color-outline: #7F8E76;
      --color-nav-inactive: #B5C2AB;
      --color-nav-active: #EDE8E0;
      --color-camera: #0F0E0D;
      --color-camera-text: #FAF7F3;
    }
    html { background-color: #1C1A18; }
    body { font-family: 'Nunito', sans-serif; background-color: var(--color-surface); color: var(--color-text); -webkit-font-smoothing: antialiased; }
    .sage-blob { position: absolute; top: -50px; right: -50px; width: 300px; height: 300px; border-radius: 50%; background: rgba(90, 111, 79, 0.15); filter: blur(40px); z-index: 0; pointer-events: none; }
    .barcode-viewfinder { background: linear-gradient(180deg, #221F1C 0%, #0F0E0D 100%); position: relative; overflow: hidden; }
    .reticle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 180px; height: 80px; border: 2px solid rgba(250,247,243,0.4); border-radius: 8px; }
    .reticle::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(250,247,243,0.8); box-shadow: 0 0 8px rgba(250,247,243,0.5); }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }

    @view-transition { navigation: auto; }
    ::view-transition { background-color: #1C1A18; }
    ::view-transition-old(main-content) { animation: 0.25s ease-out both fade-out; }
    ::view-transition-new(main-content) { animation: 0.25s ease-in 0.1s both fade-in; }
    @keyframes fade-out { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-8px); } }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  </style></head><body><div class="w-full h-screen flex flex-col relative overflow-hidden" style="view-transition-name: main-content;"><div class="sage-blob"></div><header class="shrink-0 pt-14 px-6 z-10 flex items-center justify-between"><a id="back-to-results" href="#scan-results" class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center hover:bg-[#272421] transition-colors"><iconify-icon icon="lucide:chevron-left" class="text-2xl text-[#7F8E76]"></iconify-icon></a><div class="flex flex-col items-center"><span class="text-[12px] font-bold uppercase tracking-[0.12em] text-[#A9B79F]">Step 1 of 3</span><div class="h-1 w-24 bg-[#3A3531] rounded-full mt-1 overflow-hidden"><div class="h-full w-1/3 bg-[#EDE8E0] rounded-full"></div></div></div><div class="w-11"></div></header><main class="flex-1 overflow-y-auto px-6 pt-6 z-10 relative flex flex-col items-center"><div class="w-full mb-6"><h2 class="text-[24px] font-black text-[#EDE8E0] leading-tight tracking-tight mb-1">Sourdough Loaf</h2><div class="flex items-center gap-2"><span class="text-[12px] font-bold text-[#A9B79F] uppercase tracking-wider">HEB SRDGH LOAF</span><span class="text-[12px] font-bold text-[#A9B79F]">•</span><span class="text-[12px] font-bold text-[#A9B79F] uppercase tracking-wider">Pantry</span><span class="text-[12px] font-bold text-[#A9B79F]">•</span><span class="text-[12px] font-black text-[#EDE8E0]">$4.99</span></div></div><div class="barcode-viewfinder w-full aspect-[4/3] rounded-[24px] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] flex items-center justify-center mb-6"><div class="reticle"></div><div class="absolute top-4 right-4"><div class="w-11 h-11 rounded-full bg-[rgba(250,247,243,0.1)] backdrop-blur-md flex items-center justify-center cursor-pointer active:scale-95 transition-transform"><iconify-icon icon="lucide:zap" class="text-[#FAF7F3]"></iconify-icon></div></div><div class="absolute bottom-4 left-1/2 -translate-x-1/2 h-[44px] px-5 bg-[rgba(15,14,13,0.75)] backdrop-blur-md rounded-full flex items-center justify-center whitespace-nowrap"><span class="text-[#FAF7F3] text-[12px] font-bold">Can't read it? Type the code</span></div></div><p class="text-center font-bold text-[16px] mb-4 leading-snug text-[#EDE8E0]">Point at the barcode on the sourdough loaf</p><button id="type-code-btn" class="w-full h-[44px] flex items-center justify-center text-[#A3B598] font-black text-[16px] mb-8 hover:opacity-80 active:scale-95 transition-all">Type the code instead</button></main><footer class="shrink-0 p-6 pb-[34px] z-10 w-full flex flex-col gap-3"><button id="no-barcode-btn" class="w-full h-[56px] bg-[#272421] border border-[#7F8E76] text-[#EDE8E0] rounded-[24px] font-black text-[16px] active:scale-95 transition-all shadow-[0_8px_16px_rgba(0,0,0,0.35)]">No barcode on this item</button><button id="skip-item-btn" class="w-full h-[56px] bg-transparent border border-[#7F8E76] text-[#A9B79F] rounded-[24px] font-black text-[16px] active:scale-95 transition-all">Skip this item</button></footer></div></body></html>
