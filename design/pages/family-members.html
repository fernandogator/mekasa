<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mekasa - Family Members</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <meta name="view-transition" content="same-origin">
  <link rel="prefetch" href="dashboard.html" as="document">
  <link rel="prefetch" href="store-selection.html" as="document">
  <link rel="prefetch" href="shopping-list.html" as="document">
  <link rel="prefetch" href="add-items.html" as="document">
  <link rel="prefetch" href="trash-station.html" as="document">
  <link rel="prefetch" href="onboarding-household.html" as="document">
  <link rel="prefetch" href="spending-report.html" as="document">
  <link rel="prefetch" href="family-members.html" as="document">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    :root {
      --color-brand: #5d5652;
      --color-brand-muted: #8fa085;
      --color-surface: #ede8e0;
      --color-surface-elevated: #faf7f3;
      --color-text: #5d5652;
      --color-text-muted: #5c6b54;
      --color-accent: #5a6f4f;
      --color-danger: #a44a3f;
      --color-success: #5a6f4f;
      --color-warning: #8b5c32;
      --color-overlay: rgba(143, 160, 133, 0.15);
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--color-surface);
      color: var(--color-text);
      margin: 0;
    }
    .text-brand { color: var(--color-brand); }
    .text-text { color: var(--color-text); }
    .text-muted { color: var(--color-text-muted); }
    .bg-brand { background-color: var(--color-brand); }
    .bg-accent { background-color: var(--color-accent); }
    .bg-surface-elevated { background-color: var(--color-surface-elevated); }
    .border-muted { border-color: rgba(183, 198, 194, 0.3); }
    .sage-blob {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--color-overlay);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    /* View Transitions */
    html { background-color: #ede8e0; }
    @view-transition { navigation: auto; }
    ::view-transition { background-color: #ede8e0; }

    ::view-transition-old(nav),
    ::view-transition-new(nav),
    ::view-transition-old(fab),
    ::view-transition-new(fab),
    ::view-transition-old(sage-blob),
    ::view-transition-new(sage-blob) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-old(main-content) {
      animation: 0.25s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
      animation: 0.25s ease-in 0.1s both fade-in;
    }

    @keyframes fade-out {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
  </style>
</head>
<body>
  <div class="w-full h-screen flex flex-col relative overflow-hidden bg-[#ede8e0]">
    <div class="sage-blob" style="view-transition-name: sage-blob"></div>
    
    <!-- Header -->
    <header class="shrink-0 pt-14 px-6 z-10">
      <div class="flex justify-between items-start">
        <div>
          <h1 class="text-3xl font-black text-brand leading-none mb-1">The Rivas House</h1>
          <p class="text-[12px] font-bold uppercase tracking-[0.1em] text-muted">You · Admin</p>
        </div>
        <a href="#settings" id="nav-settings-btn" class="w-10 h-10 rounded-full bg-surface-elevated shadow-sm flex items-center justify-center border border-muted">
          <iconify-icon icon="lucide:settings" class="text-xl text-brand"></iconify-icon>
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-6 pt-8 pb-32 z-10 space-y-6" style="view-transition-name: main-content">
      
      <!-- People List -->
      <div class="bg-surface-elevated rounded-[32px] p-2 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.08)] border border-muted space-y-1">
        
        <!-- Member 1: Fern (You) -->
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f8f9f8] transition-colors">
          <div class="w-12 h-12 rounded-full bg-[#5a6f4f]/20 flex items-center justify-center mr-4 shrink-0 overflow-hidden">
             <span class="text-xl font-bold text-[#5d5652]">F</span>
          </div>
          <div class="flex-1">
            <p class="font-bold text-[16px]">Fern</p>
            <div class="flex items-center mt-1">
              <span class="px-2 py-0.5 bg-[#8fa085]/20 rounded-full text-[12px] font-bold uppercase tracking-wider text-[#5d5652]">Admin</span>
            </div>
          </div>
          <button id="btn-member-fern-more" class="w-10 h-10 rounded-full flex items-center justify-center text-muted hover:bg-gray-100">
            <iconify-icon icon="lucide:more-vertical"></iconify-icon>
          </button>
        </div>

        <!-- Member 2: Maya -->
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f8f9f8] transition-colors">
          <div class="w-12 h-12 rounded-full bg-[#f1f4f3] flex items-center justify-center mr-4 shrink-0 overflow-hidden">
            <span class="text-xl font-bold text-brand">M</span>
          </div>
          <div class="flex-1">
            <p class="font-bold text-[16px]">Maya</p>
            <div class="flex items-center mt-1">
              <span class="px-2 py-0.5 bg-[#8fa085]/20 rounded-full text-[12px] font-bold uppercase tracking-wider text-[#5d5652]">Member</span>
            </div>
          </div>
          <button id="btn-member-maya-more" class="w-10 h-10 rounded-full flex items-center justify-center text-muted hover:bg-gray-100">
            <iconify-icon icon="lucide:more-vertical"></iconify-icon>
          </button>
        </div>

        <!-- Member 3: Luis -->
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f8f9f8] transition-colors">
          <div class="w-12 h-12 rounded-full bg-[#f1f4f3] flex items-center justify-center mr-4 shrink-0 overflow-hidden">
             <span class="text-xl font-bold text-brand">L</span>
          </div>
          <div class="flex-1">
            <p class="font-bold text-[16px]">Luis</p>
            <div class="flex items-center mt-1">
              <span class="px-2 py-0.5 bg-[#8fa085]/20 rounded-full text-[12px] font-bold uppercase tracking-wider text-[#5d5652]">Member</span>
            </div>
          </div>
          <button id="btn-member-luis-more" class="w-10 h-10 rounded-full flex items-center justify-center text-muted hover:bg-gray-100">
            <iconify-icon icon="lucide:more-vertical"></iconify-icon>
          </button>
        </div>

        <!-- Member 4: Jordan (Invited) -->
        <div class="flex items-center p-3 rounded-[24px] hover:bg-[#f8f9f8] transition-colors opacity-70">
          <div class="w-12 h-12 rounded-full border-2 border-dashed border-muted flex items-center justify-center mr-4 shrink-0">
            <iconify-icon icon="lucide:user" class="text-xl text-muted"></iconify-icon>
          </div>
          <div class="flex-1">
            <p class="font-bold text-[16px] text-muted">Jordan</p>
            <div class="flex items-center mt-1">
              <span class="px-2 py-0.5 bg-[#c48c5a]/20 rounded-full text-[12px] font-bold uppercase tracking-wider text-[#a44a3f]">Invited</span>
            </div>
          </div>
          <button id="btn-member-jordan-more" class="w-10 h-10 rounded-full flex items-center justify-center text-muted hover:bg-gray-100">
            <iconify-icon icon="lucide:more-vertical"></iconify-icon>
          </button>
        </div>

      </div>

      <!-- Actions -->
      <div class="space-y-4 pt-4">
        <button id="btn-invite-member" class="w-full h-[56px] bg-accent text-white font-bold rounded-full shadow-[0_8px_16px_rgba(93,86,82,0.12)] active:scale-95 transition-transform flex items-center justify-center space-x-2">
          <iconify-icon icon="lucide:user-plus" class="text-xl"></iconify-icon>
          <span>Invite someone</span>
        </button>
        
        <button id="btn-leave-household" class="w-full h-[56px] bg-white border border-muted text-brand font-bold rounded-full active:scale-95 transition-transform">
          Leave household
        </button>
      </div>

    </main>

    <!-- Bottom Navigation (Persistent) -->
    <nav class="absolute bottom-8 left-6 right-6 z-40" style="view-transition-name: nav">
      <div class="bg-brand h-[64px] rounded-full flex items-center justify-between px-6 shadow-xl relative">
        <a href="dashboard.html" id="nav-home-link" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12">
          <iconify-icon icon="lucide:home" class="text-2xl mb-1"></iconify-icon>
        </a>
        <a href="shopping-list.html" id="nav-list-link" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12">
          <iconify-icon icon="lucide:list-todo" class="text-2xl mb-1"></iconify-icon>
        </a>
        
        <!-- Spacer for FAB -->
        <div class="w-16"></div>
        
        <a href="spending-report.html" id="nav-spend-link" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12">
          <iconify-icon icon="lucide:pie-chart" class="text-2xl mb-1"></iconify-icon>
        </a>
        <a href="family-members.html" id="nav-people-link" class="flex flex-col items-center justify-center text-white w-12">
          <iconify-icon icon="lucide:users" class="text-2xl mb-1"></iconify-icon>
        </a>
      </div>
      
      <!-- Center Add FAB (Persistent) -->
      <a href="add-items.html" id="nav-fab-link" class="absolute left-1/2 -top-6 -translate-x-1/2 w-[56px] h-[56px] bg-accent rounded-full flex items-center justify-center text-white shadow-[0_8px_16px_rgba(93,86,82,0.12)] border-[4px] border-[#ede8e0] active:scale-95 transition-transform" style="view-transition-name: fab">
        <iconify-icon icon="lucide:plus" class="text-2xl"></iconify-icon>
      </a>
    </nav>

  </div>
<nav class="fixed top-0 left-0 right-0 z-50 px-2 pt-1 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-md flex gap-1 flex-nowrap overflow-x-auto text-[12px] font-bold">
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="dashboard.html">Home</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="onboarding-household.html">Onboard</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="store-selection.html">Stores</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="shopping-list.html">List</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="add-items.html">Add</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="scan-receipt-results.html">Scan</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="trash-station.html">Trash</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="spending-report.html">Spend</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="family-members.html">Family</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="../">Index</a>
  </div>
</nav>
</body></html>
