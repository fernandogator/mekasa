<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mekasa - Name this house</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <meta name="view-transition" content="same-origin">
  <link rel="prefetch" href="dashboard.html" as="document">
  <link rel="prefetch" href="store-selection.html" as="document">
  <link rel="prefetch" href="shopping-list.html" as="document">
  <link rel="prefetch" href="add-items.html" as="document">
  <link rel="prefetch" href="trash-station.html" as="document">
  <link rel="prefetch" href="spending-report.html" as="document">
  <link rel="prefetch" href="family-members.html" as="document">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    :root {
      --color-brand: #5d5652;
      --color-brand-muted: #8fa085;
      --color-surface: #ede8e0;
      --color-surface-elevated: #faf7f3;
      --color-text: #5d5652;
      --color-text-muted: #5c6b54;
      --color-accent: #5a6f4f;
      --color-danger: #5d5652;
      --color-success: #5a6f4f;
      --color-warning: #8b5c32;
      --color-overlay: rgba(143, 160, 133, 0.15);
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--color-surface);
      color: var(--color-text);
      margin: 0;
    }
    html {
      background-color: var(--color-surface);
    }
    @view-transition {
      navigation: auto;
    }
    ::view-transition {
      background-color: var(--color-surface);
    }
    ::view-transition-old(main-content) {
      animation: 0.25s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
      animation: 0.25s ease-in 0.1s both fade-in;
    }
    @keyframes fade-out {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    .sage-blob {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--color-overlay);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="w-full h-screen flex flex-col relative overflow-hidden bg-[#ede8e0]">
    <div class="sage-blob"></div>
    
    <!-- Onboarding Header -->
    <header class="shrink-0 pt-14 px-6 z-10 flex flex-col items-center relative">
      <a href="#settings" id="header-settings-link" class="absolute right-6 top-14 w-10 h-10 rounded-full flex items-center justify-center text-muted hover:bg-white/50 transition-colors">
        <iconify-icon icon="lucide:settings" class="text-xl"></iconify-icon>
      </a>
      <div class="text-[12px] font-bold uppercase tracking-[0.12em] text-[#5c6b54] mb-2">2 / 6</div>
      <div class="text-3xl font-black text-[#5d5652] tracking-tight">Mekasa</div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-6 pt-12 pb-32 z-10 flex flex-col items-center text-center" style="view-transition-name: main-content">
      
      <h1 class="text-[32px] font-black text-[#5d5652] leading-tight mb-8">
        Name this house.
      </h1>

      <!-- Photo Drop Zone -->
      <div class="relative w-32 h-32 mb-10 cursor-pointer group">
        <div class="w-full h-full rounded-full bg-[#faf7f3] border-2 border-dashed border-[#76896b] flex flex-col items-center justify-center text-[#5d5652] shadow-sm group-hover:bg-[#ede8e0]/50 transition-all">
          <iconify-icon icon="lucide:home" class="text-3xl text-[#5c6b54] mb-1"></iconify-icon>
          <span class="text-[12px] font-bold uppercase tracking-wider text-[#5c6b54]">Add Photo</span>
        </div>
        <button id="photo-upload-btn" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-[#5d5652] text-white flex items-center justify-center shadow-md active:scale-90 transition-transform">
          <iconify-icon icon="lucide:camera" class="text-sm"></iconify-icon>
        </button>
      </div>

      <!-- Form Input -->
      <div class="w-full max-w-sm flex flex-col items-start">
        <label class="text-[12px] font-bold uppercase tracking-[0.1em] text-[#5c6b54] mb-2 ml-4">Household Name</label>
        <input type="text" value="The Rivas House" class="w-full bg-[#faf7f3] text-[#5d5652] text-[20px] font-extrabold rounded-[24px] px-6 py-4 shadow-sm border border-[#8fa085]/20 focus:outline-none focus:ring-2 focus:ring-[#5a6f4f] transition-all">
        <p class="text-[14px] font-semibold text-[#5c6b54] mt-4 text-left ml-4 leading-relaxed">
          You're the admin. You can invite people next.
        </p>
      </div>

    </main>

    <!-- Sticky Bottom CTA -->
    <div class="absolute bottom-0 left-0 right-0 p-6 pb-8 z-40 bg-gradient-to-t from-[#ede8e0] via-[#ede8e0] to-transparent">
      <a href="store-selection.html" id="continue-btn" class="w-full h-[56px] bg-[#5a6f4f] text-white text-[18px] font-extrabold rounded-[24px] flex items-center justify-center shadow-[0_8px_20px_rgba(90,111,79,0.3)] active:scale-95 transition-transform">
        Continue
      </a>
    </div>

  </div>
<nav class="fixed top-0 left-0 right-0 z-50 px-2 pt-1 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-md flex gap-1 flex-nowrap overflow-x-auto text-[12px] font-bold">
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="dashboard.html">Home</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="onboarding-household.html">Onboard</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="store-selection.html">Stores</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="shopping-list.html">List</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="add-items.html">Add</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="scan-receipt-results.html">Scan</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="trash-station.html">Trash</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="spending-report.html">Spend</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="family-members.html">Family</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="../">Index</a>
  </div>
</nav>
</body>
</html>
