<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"><style>:root {--color-brand: #171e19;--color-brand-muted: #b7c6c2;--color-surface: #eeebe3;--color-surface-elevated: #ffffff;--color-text: #171e19;--color-text-muted: #6d7a76;--color-accent: #ca0013;--color-placeholder: #e8ebe8;--color-overlay: rgba(183, 198, 194, 0.20);}body {font-family: 'Nunito', sans-serif;background-color: var(--color-surface);color: var(--color-text);margin: 0;overflow: hidden;}.sage-blob {position: absolute;top: -50px;right: -50px;width: 300px;height: 300px;border-radius: 50%;background: var(--color-overlay);filter: blur(40px);z-index: 0;pointer-events: none;}.photo-frame {aspect-ratio: 1 / 1;width: 100%;border-radius: 40px;overflow: hidden;position: relative;background-color: var(--color-placeholder);border: 1px dashed var(--color-brand-muted);}.btn-disabled {background-color: var(--color-brand-muted);color: #ffffff;cursor: not-allowed;opacity: 0.6;}</style></head><body><div class="w-full h-screen flex flex-col relative overflow-hidden" data-sd-id="1"><div class="sage-blob" data-sd-id="2"></div><header class="shrink-0 pt-14 px-6 flex items-center justify-between z-10" data-sd-id="3"><button id="header-cancel" class="text-brand text-[17px] font-bold py-2" data-sd-id="4">Cancel</button><h1 class="text-[18px] font-black tracking-tight" data-sd-id="5">Product photo</h1><button id="header-save" class="text-brand-muted text-[17px] font-black py-2 cursor-not-allowed" disabled="" data-sd-id="6">Save</button></header><main class="flex-1 overflow-y-auto px-6 pt-8 z-10" data-sd-id="7"><div class="space-y-2 mb-8" data-sd-id="8"><label class="text-[10px] font-bold uppercase tracking-[0.12em] text-text-muted ml-2" data-sd-id="9">Product name</label><div class="relative" data-sd-id="10"><input type="text" class="w-full h-[56px] bg-white border border-[#b7c6c2]/40 rounded-[20px] px-5 text-[16px] font-semibold outline-none focus:border-accent transition-colors shadow-sm" placeholder="e.g. 2% Milk" data-sd-id="11"></div></div><div class="space-y-4" data-sd-id="12"><label class="text-[10px] font-bold uppercase tracking-[0.12em] text-text-muted ml-2" data-sd-id="13">Framing</label><div class="photo-frame flex flex-col items-center justify-center space-y-3" data-sd-id="14"><iconify-icon icon="lucide:image-plus" class="text-5xl text-[#6d7a76]/40"></iconify-icon><p class="text-[14px] font-bold text-[#6d7a76]/60" data-sd-id="15">No photo selected</p></div><div class="flex flex-col items-center pt-2" data-sd-id="16"><p class="text-[12px] font-bold text-text-muted" data-sd-id="17">Upload a product photo</p></div></div><div class="mt-10 space-y-3 pb-8" data-sd-id="18"><button id="btn-take-photo" class="flex items-center justify-center w-full h-[56px] bg-accent text-white rounded-[24px] font-black text-[16px] shadow-[0_8px_16px_rgba(202,0,19,0.2)] active:scale-95 transition-transform" data-sd-id="19"><iconify-icon icon="lucide:camera" class="mr-2 text-xl"></iconify-icon>Take photo</button><button id="btn-choose-photos" class="flex items-center justify-center w-full h-[56px] bg-white text-brand border border-[#b7c6c2] rounded-[24px] font-black text-[16px] active:scale-95 transition-transform" data-sd-id="20"><iconify-icon icon="lucide:image" class="mr-2 text-xl"></iconify-icon>Choose from Photos</button></div><div class="max-w-[280px] mx-auto text-center" data-sd-id="21"><p class="text-[13px] text-text-muted font-medium leading-relaxed" data-sd-id="22">Custom product images help identify items faster in your household pantry.</p></div></main><footer class="shrink-0 px-6 pb-[34px] pt-4 z-10" data-sd-id="23"><button id="btn-save-disabled" class="btn-disabled flex items-center justify-center w-full h-[56px] rounded-[24px] font-black text-[17px] shadow-none" disabled="" data-sd-id="24">Save Product</button></footer></div></body></html>
