<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"><style>:root{--color-brand:#171e19;--color-brand-muted:#b7c6c2;--color-surface:#eeebe3;--color-surface-elevated:#ffffff;--color-text:#171e19;--color-text-muted:#6d7a76;--color-accent:#ca0013;--color-overlay:rgba(183, 198, 194, 0.20)}body{font-family:'Nunito',sans-serif;background-color:var(--color-surface);color:var(--color-text);margin:0}.sage-blob{position:absolute;top:-50px;right:-50px;width:300px;height:300px;border-radius:50%;background:var(--color-overlay);filter:blur(40px);z-index:0;pointer-events:none}.photo-frame-empty{width:100%;height:220px;border-radius:40px;background-color:#e8ebe8;border:2px dashed var(--color-brand-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.btn-pill{border-radius:999px;height:56px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;transition:all 0.2s ease}.input-field{background:var(--color-surface-elevated);border:1px solid rgba(183,198,194,0.4);border-radius:20px;height:56px;padding:0 20px;font-size:16px;font-weight:600;width:100%;outline:none}</style></head><body><div class="w-full h-screen flex flex-col relative overflow-hidden" data-sd-id="1"><div class="sage-blob" data-sd-id="2"></div><header class="shrink-0 pt-14 px-6 flex items-center justify-between z-10" data-sd-id="3"><a id="nav-cancel" href="#" class="text-brand text-[17px] font-bold py-2" data-sd-id="4">Cancel</a><h1 class="text-[18px] font-black tracking-tight" data-sd-id="5">Home photo</h1><button id="nav-save-header" class="text-brand-muted text-[17px] font-black py-2 opacity-50 cursor-not-allowed" data-sd-id="6">Save</button></header><main class="flex-1 overflow-y-auto px-6 pt-8 z-10" data-sd-id="7"><div class="space-y-2 mb-8" data-sd-id="8"><label class="text-[10px] font-bold uppercase tracking-[0.12em] text-text-muted ml-2" data-sd-id="9">House name</label><input type="text" class="input-field" placeholder="The Guerrero Home" value="" data-sd-id="10"></div><div class="space-y-4" data-sd-id="11"><label class="text-[10px] font-bold uppercase tracking-[0.12em] text-text-muted ml-2" data-sd-id="12">Crop Preview</label><div class="photo-frame-empty shadow-inner" data-sd-id="13"><iconify-icon icon="lucide:home" class="text-4xl text-[#6d7a76] mb-2"></iconify-icon><span class="text-[13px] font-bold text-[#6d7a76]" data-sd-id="14">Tap to add photo</span></div><p class="text-center text-[12px] font-semibold text-[#6d7a76]" data-sd-id="15">Pinch to zoom · drag to reposition</p></div><div class="mt-10 space-y-3" data-sd-id="16"><p class="text-center text-[12px] font-bold text-[#6d7a76] uppercase tracking-wider mb-2" data-sd-id="17">No photo selected yet</p><button class="btn-pill bg-accent text-white w-full shadow-[0_8px_16px_rgba(202,0,19,0.2)] active:scale-95 transition-transform" data-sd-id="18"><iconify-icon icon="lucide:camera" class="text-xl mr-2"></iconify-icon>Take photo</button><button class="btn-pill bg-white text-brand border border-[#b7c6c2] w-full active:scale-95 transition-transform" data-sd-id="19"><iconify-icon icon="lucide:image" class="text-xl mr-2"></iconify-icon>Choose from Photos</button></div><p class="mt-8 text-center text-[13px] text-text-muted font-medium leading-relaxed max-w-[280px] mx-auto" data-sd-id="20">Owners can update this anytime. Members see it on the dashboard hero.</p></main><footer class="shrink-0 px-6 pb-[34px] pt-4 z-10" data-sd-id="21"><button id="btn-save-footer" class="btn-pill bg-[#b7c6c2] text-white w-full cursor-not-allowed opacity-60" data-sd-id="22">Save Changes</button></footer></div></body></html>
