<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --color-brand: #D4A01B;
      --color-brand-muted: #B8860B;
      --color-surface: #1A1513;
      --color-surface-elevated: #2D2620;
      --color-surface-muted: #3D3630;
      --color-text: #F5E8DC;
      --color-text-muted: #C4B5A0;
      --color-accent: #9FD356;
      --color-danger: #E8745C;
      --color-success: #A8B86F;
      --color-warning: #E8C74F;
      --color-warning-tint: #3A2E14;
      --color-success-tint: #2A3318;
      --color-accent-tint: #2A3318;
      --color-danger-tint: #3A221C;
      --color-line: #A8894A;
      --color-border: #A8894A;
      --color-on-brand: #1A1513;
      --color-on-accent: #1A1513;
      --color-on-brand-muted: #5C4A2E;
      --color-overlay: rgba(184, 134, 11, 0.15);
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--color-surface);
      color: var(--color-text);
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .safe-top { padding-top: 56px; }
    .safe-bottom { padding-bottom: 34px; }
    
    .halloween-gradient {
      background: linear-gradient(to bottom, rgba(26, 21, 19, 0.1) 0%, rgba(26, 21, 19, 0.8) 100%);
    }

    .card-shadow {
      shadow-sm border border-[#5C523D]/30;
    }

    .bat-float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-5px) rotate(5deg); }
    }

    @view-transition {
      navigation: auto;
    }
  </style>
</head>
<body>
  <div class="w-full h-screen flex flex-col relative overflow-hidden" data-sd-id="1">
    <!-- Atmosphere Blob -->
    <div class="absolute top-[-100px] right-[-100px] w-[300px] h-[300px] rounded-full bg-[#9FD356]/5 blur-[80px] pointer-events-none z-0" data-sd-id="2"></div>

    <main class="flex-1 overflow-y-auto pb-32" data-sd-id="3">
      <!-- Hero Section -->
      <div class="relative h-[220px] w-full overflow-hidden rounded-b-[40px] z-10" data-sd-id="4">
        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/747347d9-34d0-43dd-a1c8-e170f34a7b5c/generated-images/9f8732d0-09bd-4440-83b1-7f3d51826963.jpg'); background-position: center 35%;" data-sd-id="5"></div>
        <div class="absolute inset-0 halloween-gradient" data-sd-id="6"></div>
        
        <!-- Subtle Decoration -->
        <div class="absolute top-16 left-6 bat-float opacity-20 pointer-events-none" data-sd-id="7">
          <iconify-icon icon="mdi:bat" class="text-2xl text-[#F5E8DC]"></iconify-icon>
        </div>

        <div class="relative h-full flex flex-col items-center justify-center px-6 text-center pt-10" data-sd-id="8">
          <p class="text-[10px] font-bold uppercase tracking-[0.12em] text-[#C4B5A0] mb-2" data-sd-id="9">Good Evening</p>
          <h1 class="text-[32px] font-black text-[#F5E8DC] leading-tight tracking-tight" data-sd-id="10">The Rodriguez House</h1>
        </div>

        <!-- Notification Bell -->
        <div class="absolute top-14 right-6" data-sd-id="11">
          <button id="bell-notification" class="w-10 h-10 rounded-full bg-[#2D2620]/40 backdrop-blur-md flex items-center justify-center border border-[#5C523D]/30 text-[#F5E8DC] active:scale-95 transition-transform" data-sd-id="12">
            <iconify-icon icon="lucide:bell" class="text-xl"></iconify-icon>
            <div class="absolute top-2.5 right-2.5 w-2 h-2 bg-[#9FD356] rounded-full border border-[#1A1513]" data-sd-id="13"></div>
          </button>
        </div>
      </div>

      <!-- Quick Stats Card Grid (Overlaid) -->
      <div class="px-6 -mt-[40px] relative z-20 mb-8" data-sd-id="14">
        <div class="grid grid-cols-2 gap-4" data-sd-id="15">
          <div class="bg-[#2D2620] p-5 rounded-[24px] shadow-sm border border-[#5C523D]/40" data-sd-id="16">
            <div class="flex items-center space-x-2 mb-2" data-sd-id="17">
              <div class="w-8 h-8 rounded-full bg-[#E8745C]/10 flex items-center justify-center" data-sd-id="18">
                <iconify-icon icon="lucide:alert-circle" class="text-[#E8745C]"></iconify-icon>
              </div>
              <span class="text-[10px] font-bold text-[#C4B5A0] uppercase tracking-wider" data-sd-id="19">Low Stock</span>
            </div>
            <div class="text-2xl font-black text-[#F5E8DC]" data-sd-id="20">12 items</div>
          </div>
          <div class="bg-[#2D2620] p-5 rounded-[24px] shadow-sm border border-[#5C523D]/40" data-sd-id="21">
            <div class="flex items-center space-x-2 mb-2" data-sd-id="22">
              <div class="w-8 h-8 rounded-full bg-[#9FD356]/10 flex items-center justify-center" data-sd-id="23">
                <iconify-icon icon="lucide:wallet" class="text-[#9FD356]"></iconify-icon>
              </div>
              <span class="text-[10px] font-bold text-[#C4B5A0] uppercase tracking-wider" data-sd-id="24">Spend</span>
            </div>
            <div class="text-2xl font-black text-[#F5E8DC]" data-sd-id="25">$430 <span class="text-xs text-[#C4B5A0] font-semibold" data-sd-id="26">/wk</span></div>
          </div>
        </div>
      </div>

      <!-- Needs Approval -->
      <section class="px-6 mb-8" data-sd-id="27">
        <div class="flex justify-between items-center mb-4" data-sd-id="28">
          <h2 class="text-[20px] font-extrabold text-[#F5E8DC]" data-sd-id="29">Needs Approval</h2>
          <button id="view-all-approvals" class="text-[10px] font-bold text-[#C4B5A0] uppercase tracking-widest" data-sd-id="30">View All</button>
        </div>
        
        <div class="bg-[#2D2620] rounded-[40px] p-2 border border-[#5C523D]/30" data-sd-id="31">
          <!-- Item Row 1 -->
          <div class="flex items-center p-3 rounded-[24px] hover:bg-[#3D3630]/50 transition-colors" data-sd-id="32">
            <div class="w-10 h-10 rounded-full bg-[#3D3630] flex items-center justify-center mr-4 shrink-0" data-sd-id="33">
              <iconify-icon icon="lucide:milk" class="text-xl text-[#D4A01B]"></iconify-icon>
            </div>
            <div class="flex-1" data-sd-id="34">
              <div class="flex items-center gap-2 mb-0.5" data-sd-id="35">
                <p class="font-bold text-[16px] text-[#F5E8DC]" data-sd-id="36">Oat Milk</p>
                <span class="text-[8px] font-black uppercase bg-[#D4A01B] text-[#1A1513] px-1.5 py-0.5 rounded-full" data-sd-id="37">Low</span>
              </div>
              <p class="text-[12px] font-semibold text-[#C4B5A0]" data-sd-id="38">Requested by Leo</p>
            </div>
            <div class="flex space-x-2" data-sd-id="39">
              <button class="w-10 h-10 rounded-full border border-[#5C523D] flex items-center justify-center text-[#F5E8DC] active:scale-90 transition-transform" data-sd-id="40">
                <iconify-icon icon="lucide:x"></iconify-icon>
              </button>
              <button class="w-10 h-10 rounded-full bg-[#D4A01B] text-[#1A1513] flex items-center justify-center active:scale-90 transition-transform" data-sd-id="41">
                <iconify-icon icon="lucide:check"></iconify-icon>
              </button>
            </div>
          </div>
          <!-- Item Row 2 -->
          <div class="flex items-center p-3 rounded-[24px] hover:bg-[#3D3630]/50 transition-colors" data-sd-id="42">
            <div class="w-10 h-10 rounded-full bg-[#3D3630] flex items-center justify-center mr-4 shrink-0" data-sd-id="43">
              <iconify-icon icon="mdi:cookie" class="text-xl text-[#D4A01B]"></iconify-icon>
            </div>
            <div class="flex-1" data-sd-id="44">
              <div class="flex items-center gap-2 mb-0.5" data-sd-id="45">
                <p class="font-bold text-[16px] text-[#F5E8DC]" data-sd-id="46">Double Stuf Oreos</p>
              </div>
              <p class="text-[12px] font-semibold text-[#C4B5A0]" data-sd-id="47">Requested by Maya</p>
            </div>
            <div class="flex space-x-2" data-sd-id="48">
              <button class="w-10 h-10 rounded-full border border-[#5C523D] flex items-center justify-center text-[#F5E8DC] active:scale-90 transition-transform" data-sd-id="49">
                <iconify-icon icon="lucide:x"></iconify-icon>
              </button>
              <button class="w-10 h-10 rounded-full bg-[#D4A01B] text-[#1A1513] flex items-center justify-center active:scale-90 transition-transform" data-sd-id="50">
                <iconify-icon icon="lucide:check"></iconify-icon>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Recent Activity -->
      <section class="px-6" data-sd-id="51">
        <div class="flex justify-between items-center mb-4" data-sd-id="52">
          <h2 class="text-[20px] font-extrabold text-[#F5E8DC]" data-sd-id="53">Recent Activity</h2>
        </div>

        <div class="space-y-4" data-sd-id="54">
          <div class="flex items-start space-x-4" data-sd-id="55">
            <div class="w-1 bg-[#4A4038] self-stretch rounded-full mt-2" data-sd-id="56"></div>
            <div class="flex-1" data-sd-id="57">
              <p class="text-xs font-bold text-[#C4B5A0] uppercase tracking-wider mb-1" data-sd-id="58">Today, 10:45 AM</p>
              <div class="bg-[#2D2620] p-4 rounded-[24px] border border-[#5C523D]/30" data-sd-id="59">
                <p class="text-sm text-[#F5E8DC]" data-sd-id="60"><span class="font-bold text-[#9FD356]" data-sd-id="61">Leo</span> marked <span class="font-bold" data-sd-id="62">Whole Milk</span> as empty.</p>
              </div>
            </div>
          </div>
          <div class="flex items-start space-x-4" data-sd-id="63">
            <div class="w-1 bg-[#4A4038] self-stretch rounded-full mt-2" data-sd-id="64"></div>
            <div class="flex-1" data-sd-id="65">
              <p class="text-xs font-bold text-[#C4B5A0] uppercase tracking-wider mb-1" data-sd-id="66">Yesterday</p>
              <div class="bg-[#2D2620] p-4 rounded-[24px] border border-[#5C523D]/30" data-sd-id="67">
                <p class="text-sm text-[#F5E8DC]" data-sd-id="68"><span class="font-bold text-[#9FD356]" data-sd-id="69">Sarah</span> approved the shopping list for <span class="font-bold text-[#D4A01B]" data-sd-id="70">Costco</span>.</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Pill Navigation -->
    <div class="fixed bottom-8 left-6 right-6 z-40" data-sd-id="71">
      <div class="bg-[#D4A01B] h-[64px] rounded-full flex items-center justify-between px-6 shadow-[0_8px_32px_rgba(212,160,27,0.2)] relative" data-sd-id="72">
        <a id="nav-home" href="#" class="flex flex-col items-center justify-center text-[#1A1513] w-12" data-sd-id="73">
          <iconify-icon icon="lucide:home" class="text-2xl"></iconify-icon>
        </a>
        <a id="nav-list" href="#" class="flex flex-col items-center justify-center text-[#8B7B3D] w-12" data-sd-id="74">
          <iconify-icon icon="lucide:list-todo" class="text-2xl"></iconify-icon>
        </a>
        
        <!-- Spacer for FAB -->
        <div class="w-16" data-sd-id="75"></div>
        
        <a id="nav-spend" href="#" class="flex flex-col items-center justify-center text-[#8B7B3D] w-12" data-sd-id="76">
          <iconify-icon icon="lucide:pie-chart" class="text-2xl"></iconify-icon>
        </a>
        <a id="nav-people" href="#" class="flex flex-col items-center justify-center text-[#8B7B3D] w-12" data-sd-id="77">
          <iconify-icon icon="lucide:users" class="text-2xl"></iconify-icon>
        </a>
      </div>
      
      <!-- Center Add FAB -->
      <a id="nav-add" href="#" class="absolute left-1/2 -top-6 -translate-x-1/2 w-[56px] h-[56px] bg-[#9FD356] rounded-full flex items-center justify-center text-[#1A1513] shadow-[0_8px_16px_rgba(159,211,86,0.3)] border-[4px] border-[#1A1513] active:scale-90 transition-transform cursor-pointer" data-sd-id="78">
        <iconify-icon icon="lucide:plus" class="text-2xl font-bold"></iconify-icon>
      </a>
    </div>

    <!-- Hidden decoration for theme feel -->
    <div class="fixed bottom-12 right-12 opacity-10 pointer-events-none" data-sd-id="79">
      <iconify-icon icon="mdi:ghost" class="text-[80px] text-[#F5E8DC]"></iconify-icon>
    </div>
  </div>

</body></html>
