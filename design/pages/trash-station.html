<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="view-transition" content="same-origin" />
  <title>Mekasa — Trash station</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #eeebe3; }
    @view-transition { navigation: auto; }
  </style>
</head>
<body>
<style>  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  :root {
    --color-brand: #171e19;
    --color-brand-muted: #b7c6c2;
    --color-surface: #eeebe3;
    --color-surface-elevated: #ffffff;
    --color-text: #171e19;
    --color-text-muted: #6d7a76;
    --color-accent: #ca0013;
    --color-danger: #ca0013;
    --color-success: #2f6b4f;
    --color-warning: #c45c12;
    --color-overlay: rgba(183, 198, 194, 0.20);
  }
  .mekasa-screen {
    font-family: Nunito, sans-serif;
    background-color: var(--color-surface);
    color: var(--color-text);
  }
  .mekasa-screen .text-brand { color: var(--color-brand); }
  .mekasa-screen .text-muted { color: var(--color-text-muted); }
  .mekasa-screen .bg-brand { background-color: var(--color-brand); }
  .mekasa-screen .bg-accent { background-color: var(--color-accent); }
  .mekasa-screen .bg-surface-elevated { background-color: var(--color-surface-elevated); }
  .mekasa-screen .border-muted { border-color: rgba(183, 198, 194, 0.3); }
  .mekasa-screen .sage-blob {
    position: absolute;
    top: -50px;
    right: -50px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: var(--color-overlay);
    filter: blur(40px);
    z-index: 0;
    pointer-events: none;
  }
  .mekasa-screen .store-checkbox {
    appearance: none;
    width: 24px;
    height: 24px;
    border: 2px solid var(--color-brand-muted);
    border-radius: 50%;
    outline: none;
    cursor: pointer;
    position: relative;
  }
  .mekasa-screen .store-checkbox:checked {
    background-color: var(--color-accent);
    border-color: var(--color-accent);
  }
  .mekasa-screen .checkbox-custom {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--color-brand-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mekasa-screen .checkbox-custom.checked {
    background-color: var(--color-accent);
    border-color: var(--color-accent);
    color: white;
  }</style>

      <div class="mekasa-screen w-full h-screen flex flex-col relative overflow-hidden bg-[#eeebe3]">
    <div class="sage-blob"></div>

    <header class="shrink-0 pt-14 px-6 z-10">
      <div class="flex items-center justify-between mb-6">
        <a href="#" class="w-10 h-10 rounded-full bg-surface-elevated shadow-sm flex items-center justify-center border border-muted">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </a>
        <p class="text-[10px] font-bold uppercase tracking-[0.1em] text-muted">Focused mode</p>
        <div class="w-10"></div>
      </div>
      <h1 class="text-3xl font-black text-brand leading-none mb-2">Trash station</h1>
      <p class="text-[16px] font-semibold text-muted">Tap what just ran out.</p>
    </header>

    <main class="flex-1 overflow-y-auto px-6 pt-6 pb-32 z-10">
      <div class="relative mb-4">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <input type="text" placeholder="Search inventory..." class="w-full h-[56px] pl-12 pr-4 bg-surface-elevated border border-muted rounded-[24px] text-[16px] font-semibold focus:outline-none focus:border-brand shadow-sm" />
      </div>

      <div class="flex gap-2 mb-6">
        <button class="px-4 h-10 rounded-full bg-brand text-white text-[12px] font-bold uppercase tracking-wider">Kitchen</button>
        <button class="px-4 h-10 rounded-full bg-surface-elevated border border-muted text-muted text-[12px] font-bold uppercase tracking-wider">Fridge</button>
      </div>

      <div class="bg-surface-elevated rounded-[40px] p-2 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.08)] border border-muted space-y-1">
        <button class="w-full flex items-center p-4 rounded-[32px] hover:bg-[#f8f9f8] transition-colors text-left">
          <div class="w-14 h-14 rounded-[16px] bg-[#f1f4f3] flex items-center justify-center mr-4 shrink-0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M8 2h8l1 4H7z"/><path d="M7 6h10v14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/></svg>
          </div>
          <div class="flex-1">
            <p class="font-extrabold text-[18px]">Milk</p>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">1 left · Kitchen</p>
          </div>
          <div class="w-12 h-12 rounded-full border-2 border-muted flex items-center justify-center">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M5 12h14"/></svg>
          </div>
        </button>

        <button class="w-full flex items-center p-4 rounded-[32px] hover:bg-[#f8f9f8] transition-colors text-left">
          <div class="w-14 h-14 rounded-[16px] bg-[#f1f4f3] flex items-center justify-center mr-4 shrink-0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M12 22c4.5 0 8-5 8-11a8 8 0 1 0-16 0c0 6 3.5 11 8 11z"/></svg>
          </div>
          <div class="flex-1">
            <p class="font-extrabold text-[18px]">Eggs</p>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">Low · Fridge</p>
          </div>
          <div class="w-12 h-12 rounded-full border-2 border-muted flex items-center justify-center">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M5 12h14"/></svg>
          </div>
        </button>

        <button class="w-full flex items-center p-4 rounded-[32px] hover:bg-[#f8f9f8] transition-colors text-left">
          <div class="w-14 h-14 rounded-[16px] bg-[#f1f4f3] flex items-center justify-center mr-4 shrink-0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
          </div>
          <div class="flex-1">
            <p class="font-extrabold text-[18px]">Spinach</p>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">Fridge</p>
          </div>
          <div class="w-12 h-12 rounded-full border-2 border-muted flex items-center justify-center">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M5 12h14"/></svg>
          </div>
        </button>

        <div class="w-full flex items-center p-4 rounded-[32px] bg-[#eaf1ec] text-left">
          <div class="w-14 h-14 rounded-[16px] bg-white flex items-center justify-center mr-4 shrink-0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg>
          </div>
          <div class="flex-1">
            <p class="font-extrabold text-[18px] text-[#2f6b4f]">Coffee pods</p>
            <p class="text-[12px] font-bold uppercase tracking-wider text-[#2f6b4f]">Removed · added to list</p>
          </div>
          <div class="w-12 h-12 rounded-full bg-[#2f6b4f] flex items-center justify-center text-white">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="m5 12 5 5L20 7"/></svg>
          </div>
        </div>
      </div>
    </main>

    <div class="absolute bottom-0 left-0 right-0 p-6 pt-4 bg-gradient-to-t from-[#eeebe3] via-[#eeebe3] to-transparent z-40">
      <a href="#" class="flex items-center justify-center w-full h-[56px] bg-white border border-muted text-brand rounded-[24px] font-extrabold text-[18px] active:scale-[0.98] transition-transform">
        Done
      </a>
    </div>
  </div>
    
  
<nav class="fixed bottom-0 left-0 right-0 z-50 px-4 pb-4 pt-2 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-md flex gap-2 justify-center flex-wrap text-[11px] font-bold">
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="dashboard.html">Home</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="onboarding-household.html">Onboard</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="store-selection.html">Stores</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="shopping-list.html">List</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="add-items.html">Add</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="trash-station.html">Trash</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="spending-report.html">Spend</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="family-members.html">Family</a>
    <a class="px-3 py-2 rounded-full bg-white/90 border border-[rgba(183,198,194,0.4)]" href="../">Index</a>
  </div>
</nav>

</body>
</html>
