<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <title>Trash Station - Mekasa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    :root {
      --color-brand: #5d5652;
      --color-brand-muted: #8fa085;
      --color-surface: #ede8e0;
      --color-surface-elevated: #faf7f3;
      --color-text: #5d5652;
      --color-text-muted: #5c6b54;
      --color-accent: #5a6f4f;
      --color-danger: #a44a3f;
      --color-success: #5a6f4f;
      --color-warning: #8b5c32;
      --color-overlay: rgba(143, 160, 133, 0.15);
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--color-surface);
      color: var(--color-text);
      margin: 0;
    }
    .text-brand { color: var(--color-brand); }
    .text-muted { color: var(--color-text-muted); }
    .bg-brand { background-color: var(--color-brand); }
    .bg-accent { background-color: var(--color-accent); }
    .bg-surface-elevated { background-color: var(--color-surface-elevated); }
    .border-muted { border-color: rgba(183, 198, 194, 0.3); }
    
    .sage-blob {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--color-overlay);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    @view-transition {
      navigation: auto;
    }
    ::view-transition-old(main-content) {
      animation: 0.25s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
      animation: 0.25s ease-in 0.1s both fade-in;
    }
    @keyframes fade-out {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.98); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
  <link rel="prefetch" href="add-items.html" as="document">
</head>
<body>
  <div class="w-full h-screen flex flex-col relative overflow-hidden bg-[#ede8e0]" style="view-transition-name: main-content">
    <div class="sage-blob"></div>

    <!-- Header with Exit Link -->
    <header class="shrink-0 pt-14 px-6 z-10">
      <div class="flex items-center justify-between mb-6">
        <a id="btn-exit-trash-station" href="add-items.html" class="w-10 h-10 rounded-full bg-surface-elevated shadow-sm flex items-center justify-center border border-muted hover:bg-[#8fa085]/10 transition-colors">
          <iconify-icon icon="lucide:x" class="text-xl text-brand"></iconify-icon>
        </a>
        <p class="text-[12px] font-bold uppercase tracking-[0.1em] text-muted">Focused mode</p>
        <div class="w-10"></div>
      </div>
      <h1 class="text-3xl font-black text-brand leading-none mb-2 tracking-tight">Trash station</h1>
      <p class="text-[16px] font-semibold text-muted">Tap what just ran out.</p>
    </header>

    <!-- Inventory List -->
    <main class="flex-1 overflow-y-auto px-6 pt-6 pb-32 z-10">
      <div class="relative mb-4">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <iconify-icon icon="lucide:search" class="text-xl text-muted"></iconify-icon>
        </div>
        <input type="text" placeholder="Search inventory..." class="w-full h-[56px] pl-12 pr-4 bg-surface-elevated border border-muted rounded-[24px] text-[16px] font-semibold focus:outline-none focus:border-brand shadow-sm">
      </div>

      <div class="flex gap-2 mb-6">
        <button class="px-4 h-10 rounded-full bg-brand text-white text-[12px] font-bold uppercase tracking-wider">Kitchen</button>
        <button class="px-4 h-10 rounded-full bg-surface-elevated border border-muted text-muted text-[12px] font-bold uppercase tracking-wider">Fridge</button>
      </div>

      <div class="bg-surface-elevated rounded-[40px] p-2 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.08)] border border-muted space-y-1">
        <!-- Tappable Inventory Row -->
        <button class="w-full flex items-center p-4 rounded-[32px] hover:bg-[#b8d4a8]/10 transition-colors text-left">
          <div class="w-14 h-14 rounded-[16px] bg-[#ede8e0] flex items-center justify-center mr-4 shrink-0">
            <iconify-icon icon="lucide:milk" class="text-2xl text-brand"></iconify-icon>
          </div>
          <div class="flex-1">
            <p class="font-extrabold text-[18px]">Milk</p>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">1 left · Kitchen</p>
          </div>
          <div class="w-12 h-12 rounded-full border-2 border-muted flex items-center justify-center active:scale-90 transition-transform">
            <iconify-icon icon="lucide:minus" class="text-xl text-brand"></iconify-icon>
          </div>
        </button>

        <button class="w-full flex items-center p-4 rounded-[32px] hover:bg-[#b8d4a8]/10 transition-colors text-left">
          <div class="w-14 h-14 rounded-[16px] bg-[#ede8e0] flex items-center justify-center mr-4 shrink-0">
            <iconify-icon icon="lucide:egg" class="text-2xl text-brand"></iconify-icon>
          </div>
          <div class="flex-1">
            <p class="font-extrabold text-[18px]">Eggs</p>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">Low · Fridge</p>
          </div>
          <div class="w-12 h-12 rounded-full border-2 border-muted flex items-center justify-center active:scale-90 transition-transform">
            <iconify-icon icon="lucide:minus" class="text-xl text-brand"></iconify-icon>
          </div>
        </button>

        <button class="w-full flex items-center p-4 rounded-[32px] hover:bg-[#b8d4a8]/10 transition-colors text-left">
          <div class="w-14 h-14 rounded-[16px] bg-[#ede8e0] flex items-center justify-center mr-4 shrink-0">
            <iconify-icon icon="lucide:leaf" class="text-2xl text-brand"></iconify-icon>
          </div>
          <div class="flex-1">
            <p class="font-extrabold text-[18px]">Spinach</p>
            <p class="text-[12px] font-bold text-muted uppercase tracking-wider">Fridge</p>
          </div>
          <div class="w-12 h-12 rounded-full border-2 border-muted flex items-center justify-center active:scale-90 transition-transform">
            <iconify-icon icon="lucide:minus" class="text-xl text-brand"></iconify-icon>
          </div>
        </button>

        <!-- Success Pulse Row -->
        <div class="w-full flex items-center p-4 rounded-[32px] bg-[#5a6f4f]/10 text-left transition-all duration-300">
          <div class="w-14 h-14 rounded-[16px] bg-white flex items-center justify-center mr-4 shrink-0">
            <iconify-icon icon="lucide:coffee" class="text-2xl text-[#5a6f4f]"></iconify-icon>
          </div>
          <div class="flex-1">
            <p class="font-extrabold text-[18px] text-[#5a6f4f]">Coffee pods</p>
            <p class="text-[12px] font-bold uppercase tracking-wider text-[#5a6f4f]">Removed · added to list</p>
          </div>
          <div class="w-12 h-12 rounded-full bg-[#5a6f4f] flex items-center justify-center text-white shadow-sm">
            <iconify-icon icon="lucide:check" class="text-xl"></iconify-icon>
          </div>
        </div>
      </div>
    </main>

    <!-- Sticky Bottom Done Button (Back to AddItems) -->
    <div class="absolute bottom-0 left-0 right-0 p-6 pb-8 bg-gradient-to-t from-[#ede8e0] via-[#ede8e0] to-transparent z-40">
      <a id="btn-done-trash-station" href="add-items.html" class="flex items-center justify-center w-full h-[56px] bg-white border border-[#8fa085]/30 text-brand rounded-[24px] font-extrabold text-[18px] active:scale-[0.98] transition-all hover:bg-[#ede8e0]/40 shadow-sm">
        Done
      </a>
    </div>
  </div>
<nav class="fixed top-0 left-0 right-0 z-50 px-2 pt-1 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-md flex gap-1 flex-nowrap overflow-x-auto text-[12px] font-bold">
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="dashboard.html">Home</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="onboarding-household.html">Onboard</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="store-selection.html">Stores</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="shopping-list.html">List</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="add-items.html">Add</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="scan-receipt-results.html">Scan</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="trash-station.html">Trash</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="spending-report.html">Spend</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="family-members.html">Family</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="../">Index</a>
  </div>
</nav>
</body>
</html>
