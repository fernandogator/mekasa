<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mekasa Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    :root {
      --color-brand: #5d5652;
      --color-brand-muted: #8fa085;
      --color-surface: #ede8e0;
      --color-surface-elevated: #faf7f3;
      --color-text: #5d5652;
      --color-text-muted: #5c6b54;
      --color-accent: #5a6f4f;
      --color-danger: #a44a3f;
      --color-success: #5a6f4f;
      --color-warning: #8b5c32;
      --color-overlay: rgba(143, 160, 133, 0.15);
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--color-surface);
      color: var(--color-text);
      margin: 0;
    }
    .text-brand { color: var(--color-brand); }
    .text-text { color: var(--color-text); }
    .text-muted { color: var(--color-text-muted); }
    .bg-brand { background-color: var(--color-brand); }
    .bg-accent { background-color: var(--color-accent); }
    .bg-surface-elevated { background-color: var(--color-surface-elevated); }
    .border-muted { border-color: rgba(143, 160, 133, 0.2); }
    .sage-blob {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--color-overlay);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }
    @view-transition { navigation: auto; }
    ::view-transition-old(main-content) { animation: 0.25s ease-out both fade-out; }
    ::view-transition-new(main-content) { animation: 0.25s ease-in 0.1s both fade-in; }
    @keyframes fade-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.98); } }
    @keyframes fade-in { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
    .nav-persistent { view-transition-name: main-nav; }
  </style>
  <meta name="view-transition" content="same-origin">
  <link rel="prefetch" href="store-selection.html" as="document">
  <link rel="prefetch" href="shopping-list.html" as="document">
  <link rel="prefetch" href="add-items.html" as="document">
  <link rel="prefetch" href="trash-station.html" as="document">
  <link rel="prefetch" href="onboarding-household.html" as="document">
  <link rel="prefetch" href="spending-report.html" as="document">
  <link rel="prefetch" href="family-members.html" as="document">
</head>
<body>
  <div class="w-full h-screen flex flex-col relative overflow-hidden bg-[#ede8e0]" data-sd-id="1">
    <div class="sage-blob" data-sd-id="2"></div>

    <!-- Hero Section -->
    <div class="relative h-[150px] w-full shrink-0 overflow-hidden rounded-b-[40px] z-10">
      <div class="absolute inset-0 bg-cover" style="background-image: url('https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/747347d9-34d0-43dd-a1c8-e170f34a7b5c/generated-images/generated-5b4fe9a7-da0a-4b7a-81a3-130f5406105f.png'); background-position: center 50%;"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-[#5d5652]/10 to-[#5d5652]/40"></div>
      <div class="relative h-full flex flex-col items-center justify-center px-6 text-center">
        <p class="text-[12px] font-bold uppercase tracking-[0.12em] text-[#faf7f3]/80 mb-2">Good Morning</p>
        <h1 class="text-[32px] font-black text-white leading-tight tracking-tight">The Rodriguez House</h1>
      </div>
      <!-- Overlay Header -->
      <div class="absolute top-14 left-6 right-6 flex justify-end">
        <button class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/20 text-white shadow-sm" data-sd-id="8">
          <iconify-icon icon="lucide:bell" class="text-xl"></iconify-icon>
          <div class="absolute top-2 right-2 w-2 h-2 bg-accent rounded-full border border-[#ede8e0]" data-sd-id="9"></div>
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-6 pt-0 pb-32 z-10 space-y-8" style="view-transition-name: main-content;" data-sd-id="10">
      
      <!-- Quick Stats -->
      <div class="grid grid-cols-2 gap-4 -mt-[40px] relative z-20 mb-8" data-sd-id="11">
        <div class="bg-surface-elevated p-5 rounded-[24px] shadow-sm border border-muted" data-sd-id="12">
          <div class="flex items-center space-x-2 mb-2" data-sd-id="13">
            <div class="w-8 h-8 rounded-full bg-[#5a6f4f]/10 flex items-center justify-center" data-sd-id="14">
              <iconify-icon icon="lucide:alert-circle" class="text-[#5a6f4f]"></iconify-icon>
            </div>
            <span class="text-[12px] font-bold text-muted uppercase tracking-wider" data-sd-id="15">Low Stock</span>
          </div>
          <div class="text-2xl font-black" data-sd-id="16">12 items</div>
        </div>
        <div class="bg-surface-elevated p-5 rounded-[24px] shadow-sm border border-muted" data-sd-id="17">
          <div class="flex items-center space-x-2 mb-2" data-sd-id="18">
            <div class="w-8 h-8 rounded-full bg-[#8fa085]/10 flex items-center justify-center" data-sd-id="19">
              <iconify-icon icon="lucide:wallet" class="text-[#5c6b54]"></iconify-icon>
            </div>
            <span class="text-[12px] font-bold text-muted uppercase tracking-wider" data-sd-id="20">Spend</span>
          </div>
          <div class="text-2xl font-black" data-sd-id="21">$430 <span class="text-xs text-muted font-semibold" data-sd-id="22">/wk</span></div>
        </div>
      </div>

      <!-- Needs Approval -->
      <section data-sd-id="23">
        <div class="flex justify-between items-center mb-4" data-sd-id="24">
          <h2 class="text-[20px] font-extrabold" data-sd-id="25">Needs Approval</h2>
          <button class="text-[12px] font-bold text-muted uppercase tracking-widest">View All</button>
        </div>
        <div class="bg-surface-elevated rounded-[32px] p-2 shadow-sm border border-muted space-y-1" data-sd-id="27">
          <!-- Item 1 -->
          <div class="flex items-center p-3 rounded-[24px] hover:bg-[#ede8e0]/40 transition-colors" data-sd-id="28">
            <div class="w-10 h-10 rounded-full bg-[#ede8e0] flex items-center justify-center mr-4 shrink-0" data-sd-id="29">
              <iconify-icon icon="lucide:milk" class="text-xl text-brand"></iconify-icon>
            </div>
            <div class="flex-1" data-sd-id="30">
              <p class="font-bold text-[15px]" data-sd-id="31">Oat Milk</p>
              <p class="text-[12px] font-semibold text-muted" data-sd-id="32">Requested by Leo</p>
            </div>
            <div class="flex space-x-2" data-sd-id="33">
              <button class="w-9 h-9 rounded-full border border-muted flex items-center justify-center text-brand" data-sd-id="34">
                <iconify-icon icon="lucide:x"></iconify-icon>
              </button>
              <button class="w-9 h-9 rounded-full bg-[#5a6f4f] text-white flex items-center justify-center" data-sd-id="35">
                <iconify-icon icon="lucide:check"></iconify-icon>
              </button>
            </div>
          </div>
          <!-- Item 2 -->
          <div class="flex items-center p-3 rounded-[24px] hover:bg-[#ede8e0]/40 transition-colors" data-sd-id="36">
            <div class="w-10 h-10 rounded-full bg-[#ede8e0] flex items-center justify-center mr-4 shrink-0" data-sd-id="37">
              <iconify-icon icon="lucide:cookie" class="text-xl text-brand"></iconify-icon>
            </div>
            <div class="flex-1" data-sd-id="38">
              <p class="font-bold text-[15px]" data-sd-id="39">Oreos</p>
              <p class="text-[12px] font-semibold text-muted" data-sd-id="40">Requested by Mia</p>
            </div>
            <div class="flex space-x-2" data-sd-id="41">
              <button class="w-9 h-9 rounded-full border border-muted flex items-center justify-center text-brand" data-sd-id="42">
                <iconify-icon icon="lucide:x"></iconify-icon>
              </button>
              <button class="w-9 h-9 rounded-full bg-[#5a6f4f] text-white flex items-center justify-center" data-sd-id="43">
                <iconify-icon icon="lucide:check"></iconify-icon>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Recent Activity -->
      <section data-sd-id="44">
        <h2 class="text-[20px] font-extrabold mb-4" data-sd-id="45">Recent Activity</h2>
        <div class="space-y-4" data-sd-id="46">
          <div class="flex items-start" data-sd-id="47">
            <div class="w-2 h-2 rounded-full bg-[#5d5652] mt-2 mr-4" data-sd-id="48"></div>
            <div data-sd-id="49">
              <p class="text-[15px] font-semibold" data-sd-id="50">Eggs marked as depleted</p>
              <p class="text-[12px] font-bold text-muted uppercase tracking-wider mt-1" data-sd-id="51">2 hours ago</p>
            </div>
          </div>
          <div class="flex items-start" data-sd-id="52">
            <div class="w-2 h-2 rounded-full bg-[#8fa085] mt-2 mr-4" data-sd-id="53"></div>
            <div data-sd-id="54">
              <p class="text-[15px] font-semibold" data-sd-id="55">H-E-B run completed</p>
              <p class="text-[12px] font-bold text-muted uppercase tracking-wider mt-1" data-sd-id="56">Yesterday</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <div class="absolute bottom-8 left-6 right-6 z-40 nav-persistent" data-sd-id="57">
      <div class="bg-brand h-[64px] rounded-full flex items-center justify-between px-6 shadow-xl relative" data-sd-id="58">
        <a id="nav-home" href="dashboard.html" class="flex flex-col items-center justify-center text-white w-12" data-sd-id="59">
          <iconify-icon icon="lucide:home" class="text-2xl mb-1"></iconify-icon>
        </a>
        <a id="nav-list" href="shopping-list.html" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12 hover:text-white transition-colors" data-sd-id="60">
          <iconify-icon icon="lucide:list-todo" class="text-2xl mb-1"></iconify-icon>
        </a>
        
        <!-- Spacer for FAB -->
        <div class="w-16" data-sd-id="61"></div>
        
        <a id="nav-spend" href="spending-report.html" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12 hover:text-white transition-colors" data-sd-id="62">
          <iconify-icon icon="lucide:pie-chart" class="text-2xl mb-1"></iconify-icon>
        </a>
        <a id="nav-people" href="family-members.html" class="flex flex-col items-center justify-center text-[#c9d6c0] w-12 hover:text-white transition-colors" data-sd-id="63">
          <iconify-icon icon="lucide:users" class="text-2xl mb-1"></iconify-icon>
        </a>
      </div>
      
      <!-- Center Add FAB -->
      <a id="nav-add" href="add-items.html" class="absolute left-1/2 -top-6 -translate-x-1/2 w-[56px] h-[56px] bg-[#5a6f4f] rounded-full flex items-center justify-center text-white shadow-[0_8px_16px_rgba(90,111,79,0.3)] border-[4px] border-[#ede8e0] active:scale-95 transition-transform cursor-pointer block" data-sd-id="64">
        <iconify-icon icon="lucide:plus" class="text-2xl"></iconify-icon>
      </a>
    </div>

  </div>

<nav class="fixed top-0 left-0 right-0 z-50 px-2 pt-1 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-md flex gap-1 flex-nowrap overflow-x-auto text-[12px] font-bold">
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="dashboard.html">Home</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="onboarding-household.html">Onboard</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="store-selection.html">Stores</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="shopping-list.html">List</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="add-items.html">Add</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="scan-receipt-results.html">Scan</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="trash-station.html">Trash</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="spending-report.html">Spend</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="family-members.html">Family</a>
    <a class="shrink-0 px-2.5 py-1 inline-flex items-center rounded-full bg-[#faf7f3]/95 border border-[#76896b] text-[#5d5652]" href="../">Index</a>
  </div>
</nav>
</body></html>
