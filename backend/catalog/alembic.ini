# Alembic config for the shared product catalog (Cloud SQL for PostgreSQL).
# Run from backend/: `alembic -c catalog/alembic.ini upgrade head`
# The connection URL is never stored here; env.py reads CATALOG_DATABASE_URL
# (local/CI direct, Cloud SQL via the Auth Proxy with --auto-iam-authn).
[alembic]
script_location = %(here)s/alembic
version_table = catalog_schema_version
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
