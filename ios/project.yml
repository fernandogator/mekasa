name: Mekasa
options:
  bundleIdPrefix: com.fernandogator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.9"
targets:
  Mekasa:
    type: application
    platform: iOS
    sources:
      - path: Mekasa
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fernandogator.mekasa
      INFOPLIST_FILE: Mekasa/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0.0"
      DEVELOPMENT_TEAM: ""
    info:
      path: Mekasa/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  MekasaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MekasaTests
    dependencies:
      - target: Mekasa
