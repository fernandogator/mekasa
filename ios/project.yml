name: Mekasa
options:
  bundleIdPrefix: com.fernandogator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.9"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.15.0
targets:
  Mekasa:
    type: application
    platform: iOS
    sources:
      # Exclude Firebase plist from the folder scan so a missing (gitignored) file
      # cannot leave a dangling Copy Bundle Resources entry. Include it explicitly
      # below only when present; CI copies Config/GoogleService-Info.ci.plist first.
      - path: Mekasa
        excludes:
          - GoogleService-Info.plist
      - path: Tests/TestSupport
      - path: Mekasa/GoogleService-Info.plist
        optional: true
        buildPhase: resources

    entitlements:
      path: Mekasa/Mekasa.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fernandogator.mekasa
      INFOPLIST_FILE: Mekasa/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_OBJC_BRIDGING_HEADER: Mekasa/Mekasa-Bridging-Header.h
      CODE_SIGN_ENTITLEMENTS: Mekasa/Mekasa.entitlements
      TARGETED_DEVICE_FAMILY: "1"
      # MARKETING_VERSION + CURRENT_PROJECT_VERSION come from Config/Version.xcconfig
      # (marketing starts at 1.0.0; build number is unique per build via preBuildScripts).
      VERSIONING_SYSTEM: apple-generic
      DEVELOPMENT_TEAM: ""
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      OTHER_LDFLAGS: "$(inherited) -ObjC"
    preBuildScripts:
      - name: Sync Google Sign-In URL scheme
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "${SRCROOT}/scripts/sync_google_signin_config.sh"
      - name: Verify Google Sign-In URL scheme
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "${SRCROOT}/scripts/verify_google_url_scheme.sh"
      - name: Ensure unique build number
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "${SRCROOT}/scripts/ensure_unique_build_number.sh"
    postBuildScripts:
      - name: Stamp unique version into built Info.plist
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /bin/bash "${SRCROOT}/scripts/ensure_unique_build_number.sh" --stamp-plist "${PLIST}"
      - name: Ensure Google Sign-In URL scheme in built Info.plist
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /bin/bash "${SRCROOT}/scripts/ensure_google_url_scheme.sh" "${PLIST}"
          # Also stamp the packaged app Info.plist when present.
          APP_PLIST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Info.plist"
          if [ -f "${APP_PLIST}" ]; then
            /bin/bash "${SRCROOT}/scripts/ensure_google_url_scheme.sh" "${APP_PLIST}"
          fi
          WRAPPER_PLIST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Info.plist"
          if [ -f "${WRAPPER_PLIST}" ]; then
            /bin/bash "${SRCROOT}/scripts/ensure_google_url_scheme.sh" "${WRAPPER_PLIST}"
          fi
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Mekasa/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        NSCameraUsageDescription: Mekasa uses the camera to scan barcodes and receipts, and to take a home photo for your dashboard.
        NSMicrophoneUsageDescription: Mekasa uses the microphone so you can add items by voice.
        NSSpeechRecognitionUsageDescription: Mekasa uses speech recognition to turn what you say into grocery items.
        NSLocationWhenInUseUsageDescription: Mekasa uses your location to suggest your home address and nearby stores.
        NSPhotoLibraryUsageDescription: Mekasa uses your photo library so you can add a household photo.
        CFBundleURLTypes:
          - CFBundleURLName: com.fernandogator.mekasa.invite
            CFBundleURLSchemes:
              - mekasa
          # OAuth redirect for Google Sign-In (REVERSED_CLIENT_ID from Firebase iOS app).
          # scripts/sync_google_signin_config.sh can refresh this from GoogleService-Info.plist.
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes:
              - com.googleusercontent.apps.934775015882-tkn8jri65ijtbadhlkpskdo3j2nh0m0t
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  MekasaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MekasaTests
      - path: Tests/Snapshots
    dependencies:
      - target: Mekasa
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      GENERATE_INFOPLIST_FILE: YES
  MekasaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
      - path: Tests/TestSupport/TestIdentifiers.swift
    dependencies:
      - target: Mekasa
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Mekasa
schemes:
  Mekasa:
    build:
      targets:
        Mekasa: all
        MekasaTests: [test]
        MekasaUITests: [test]
    test:
      config: Debug
      testPlans:
        - path: UnitTests.xctestplan
          defaultPlan: true
        - path: StructuralTests.xctestplan
          defaultPlan: false
        - path: SnapshotTests.xctestplan
          defaultPlan: false
      targets:
        - name: MekasaTests
        - name: MekasaUITests
          skippedTests: []
