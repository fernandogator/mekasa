name: Mekasa
options:
  bundleIdPrefix: com.fernandogator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.9"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  Mekasa:
    type: application
    platform: iOS
    sources:
      - path: Mekasa
      # Present only on your Mac (gitignored). Re-run xcodegen after adding it.
      - path: Mekasa/GoogleService-Info.plist
        optional: true
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fernandogator.mekasa
      INFOPLIST_FILE: Mekasa/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0.0"
      DEVELOPMENT_TEAM: ""
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Mekasa/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  MekasaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MekasaTests
    dependencies:
      - target: Mekasa
